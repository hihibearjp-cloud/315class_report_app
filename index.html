<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>315 學生班級成績通知系統</title>
    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 載入 React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- 載入 Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- 載入 SheetJS (Excel 解析必備) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght=300;400;500;700;900&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #F6F4EE;
        }
        /* 列印專用 CSS */
        @media print {
            body {
                background-color: #FFFFFF !important;
                font-size: 11pt;
            }
            .no-print {
                display: none !important;
            }
            .print-page {
                page-break-after: always;
                box-shadow: none !important;
                border: none !important;
                margin: 0 !important;
                padding: 1.2cm !important;
                width: 100% !important;
                max-width: 100% !important;
                height: auto !important;
            }
        }
        /* 淡入動畫 */
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col">
    <div id="root"></div>

    <!-- Firebase 模組載入與全域 API 準備 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 使用環境提供的配置，若無則提供空殼（防呆）
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        
        let app, db, auth;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        } catch (e) {
            console.error("Firebase 初始化失敗", e);
        }

        window.firebaseAPI = {
            db, auth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, collection, doc, setDoc, onSnapshot, deleteDoc
        };
        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            // Firebase 狀態
            const [firebaseReady, setFirebaseReady] = useState(!!window.firebaseAPI?.auth);
            const [firebaseUser, setFirebaseUser] = useState(null);
            
            // App ID 處理
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
            
            // 系統模式與頁面
            const [viewMode, setViewMode] = useState('parent-login'); // 'parent-login', 'parent-dashboard', 'teacher-dashboard'
            const [currentStudent, setCurrentStudent] = useState(null);
            const [students, setStudents] = useState([]);
            
            // 系統設定 (考科範圍與日期為核心)
            const [settings, setSettings] = useState({
                className: "315",
                gradingTone: "溫和鼓勵", // '溫和鼓勵', '積極督促', '嚴格警示'
                printRemark: "請家長與學生一同審視本次段考各科目範圍的熟練度，並持續配合在家複習。",
                showTotalAvg: true,
                showGradeLevel: true,
                showClassAvg: true,
                showProgress: true,
                enableComments: true,
                subjects: [
                    { name: "國文", date: "07/05", scope: "第1章到第4章", locked: false },
                    { name: "英語", date: "07/05", scope: "L1-L3 單字句型", locked: false },
                    { name: "數學", date: "07/05", scope: "1-1 到 2-2 基礎運算", locked: false },
                    { name: "理化", date: "07/05", scope: "溫度與熱、光學現象", locked: false },
                    { name: "歷史", date: "07/05", scope: "第一單元 早期台灣", locked: false },
                    { name: "地理", date: "07/05", scope: "台灣地形與氣候類型", locked: false },
                    { name: "公民", date: "07/05", scope: "單元一 社會中的互動", locked: false },
                    { name: "生物", date: "07/05", scope: "第一章 細胞的構造與生理", locked: false }
                ]
            });

            // 登入與管理驗證狀態
            const [loginData, setLoginData] = useState({ seatNo: '', password: '' });
            const [teacherPass, setTeacherPass] = useState('');
            const [showTeacherModal, setShowTeacherModal] = useState(false);
            const [showPassword, setShowPassword] = useState(false);
            
            // 單一分數自主填寫成績
            const [editingSubject, setEditingSubject] = useState(null);
            const [editForm, setEditForm] = useState({ score: '' });
            
            // 教師端編輯與手動新增學生的狀態
            const [modifyingStudent, setModifyingStudent] = useState(null);
            const [showAddStudent, setShowAddStudent] = useState(false);
            const [newStudentData, setNewStudentData] = useState({ seatNo: '', name: '', password: '' });

            // 考科範圍編輯狀態
            const [newSubjectName, setNewSubjectName] = useState('英文');
            const [customSubjectName, setCustomSubjectName] = useState('');
            const [newSubjectScope, setNewSubjectScope] = useState('');
            const [newSubjectDate, setNewSubjectDate] = useState('');

            // UI 狀態控制
            const [toast, setToast] = useState(null);
            const [excelDragActive, setExcelDragActive] = useState(false);
            const fileInputRef = useRef(null);

            // ================= Firebase 初始化與驗證 =================
            useEffect(() => {
                if (!window.firebaseAPI?.auth) {
                    const handleReady = () => setFirebaseReady(true);
                    window.addEventListener('firebase-ready', handleReady);
                    return () => window.removeEventListener('firebase-ready', handleReady);
                }
            }, []);

            useEffect(() => {
                if (!firebaseReady) return;
                const { auth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } = window.firebaseAPI;
                
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (err) {
                        console.error("Firebase 驗證失敗:", err);
                        showToast("系統連線異常，請重新整理頁面。", "error");
                    }
                };

                initAuth();
                const unsubscribe = onAuthStateChanged(auth, user => {
                    setFirebaseUser(user);
                });
                return () => unsubscribe();
            }, [firebaseReady]);

            // ================= 監聽資料庫 =================
            useEffect(() => {
                // 必須等待 user 驗證完成才能掛載監聽器，避免權限錯誤
                if (!firebaseReady || !firebaseUser) return;
                const { db, collection, doc, onSnapshot } = window.firebaseAPI;

                // 監聽並正規化設定檔 (全域公開資料)
                const settingsRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'global');
                const unsubSettings = onSnapshot(settingsRef, (snap) => {
                    if (snap.exists()) {
                        const cloudData = snap.data();
                        let rawSubjects = cloudData.subjects || [];
                        const normalizedSubjects = rawSubjects.map(sub => {
                            if (typeof sub === 'string') {
                                return { name: sub, date: "07/05", scope: "未設定範圍", locked: false };
                            }
                            return {
                                name: sub.name || "",
                                date: sub.date || "07/05",
                                scope: sub.scope || "未設定範圍",
                                locked: sub.locked || false
                            };
                        });
                        setSettings({ ...cloudData, subjects: normalizedSubjects });
                    }
                }, (error) => console.error("設定檔讀取失敗:", error));

                // 監聽學生成績列表 (全域公開資料)
                const studentsRef = collection(db, 'artifacts', appId, 'public', 'data', 'submissions');
                const unsubStudents = onSnapshot(studentsRef, (snap) => {
                    const list = snap.docs
                        .filter(d => d.id.startsWith('student_')) // 過濾出學生文件
                        .map(d => ({ id: d.id, ...d.data() }));
                        
                    list.sort((a, b) => {
                        const seatA = String(a.seatNo || '');
                        const seatB = String(b.seatNo || '');
                        return seatA.localeCompare(seatB, undefined, {numeric: true});
                    });
                    
                    setStudents(list);

                    // 保持當前檢視學生資訊最新
                    if (currentStudent) {
                        const updated = list.find(s => s.id === currentStudent.id);
                        if (updated) setCurrentStudent(updated);
                    }
                }, (error) => console.error("學生資料讀取失敗:", error));

                return () => {
                    unsubSettings();
                    unsubStudents();
                };
            }, [firebaseReady, firebaseUser, appId]); // 移除 currentStudent.id 避免無限迴圈

            // ================= 工具函數 =================
            const showToast = (text, type = 'success') => {
                setToast({ text, type });
                setTimeout(() => setToast(null), 3000);
            };

            const saveSettingsToCloud = async (newSettings) => {
                if (!firebaseUser) return showToast("尚未連線至伺服器", "error");
                try {
                    const { db, doc, setDoc } = window.firebaseAPI;
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'global'), newSettings);
                    showToast("教師端設定已同步儲存！");
                } catch (e) {
                    showToast("同步失敗：" + e.message, "error");
                }
            };

            const getStudentScore = (student, subName) => {
                if (!student?.scores) return null;
                const s = student.scores[subName];
                if (s === undefined || s === null) return null;
                if (typeof s === 'number') return s;
                if (typeof s === 'string') return parseFloat(s) || null;
                if (typeof s === 'object') {
                    if (s.score !== undefined && s.score !== '') return parseFloat(s.score);
                    if (s.regular !== undefined && s.exam !== undefined) {
                        return (parseFloat(s.regular) + parseFloat(s.exam)) / 2;
                    }
                    if (s.regular !== undefined) return parseFloat(s.regular);
                    return null;
                }
                return null;
            };

            const calculateStudentAvg = (student) => {
                if (!student?.scores || settings.subjects.length === 0) return 0;
                let sum = 0, validCount = 0;
                settings.subjects.forEach(sub => {
                    const val = getStudentScore(student, sub.name);
                    if (val !== null) { sum += val; validCount++; }
                });
                return validCount > 0 ? sum / validCount : 0;
            };

            const calculateClassSubjectAvg = (subjectName) => {
                if (students.length === 0) return 0;
                let sum = 0, count = 0;
                students.forEach(s => {
                    const val = getStudentScore(s, subjectName);
                    if (val !== null) { sum += val; count++; }
                });
                return count > 0 ? sum / count : 0;
            };

            const getGradeLevelStats = () => {
                const stats = { A: 0, B: 0, C: 0, D: 0, E: 0, avg: 0 };
                if (students.length === 0) return stats;
                let totalSum = 0;
                students.forEach(s => {
                    const avg = calculateStudentAvg(s);
                    totalSum += avg;
                    if (avg >= 90) stats.A++;
                    else if (avg >= 80) stats.B++;
                    else if (avg >= 70) stats.C++;
                    else if (avg >= 60) stats.D++;
                    else stats.E++;
                });
                stats.avg = totalSum / students.length;
                return stats;
            };

            const getGradeLevelName = (avg) => {
                if (avg >= 90) return "A級距 (90-100)";
                if (avg >= 80) return "B級距 (80-89)";
                if (avg >= 70) return "C級距 (70-79)";
                if (avg >= 60) return "D級距 (60-69)";
                return "E級距 (60分以下)";
            };

            // 智慧診斷邏輯
            const getLocalDiagnostic = (student, subName, score, classAvg, tone) => {
                if (score === null || score === undefined) return "尚未登記該科成績。";
                
                if (tone === "溫和鼓勵") {
                    if (score >= 90) return `${subName}表現優異，觀念通透，請繼續保持優秀手感！`;
                    if (score >= 80) return `${subName}實力良好，多一份細心與沉著就能再次突破。`;
                    if (score >= 60) return `${subName}基本分已掌握，針對錯題進行反思即可穩步前進。`;
                    return `${subName}目前稍嫌吃力，建議每日花15分鐘重新釐清觀念。`;
                } else if (tone === "積極督促") {
                    if (score >= 90) return `${subName}成績頂尖但不能自滿，應挑戰更高階的思考題。`;
                    if (score >= 80) return `${subName}觀念理解但粗心偏多，考後請確實落實錯題訂正。`;
                    if (score >= 60) return `${subName}成績中游，讀書複習必須更加主動以防退步。`;
                    return `${subName}落後較多，務必制定每天練習計畫，重新打穩基礎。`;
                } else { // 嚴格警示
                    if (score >= 90) return `${subName}維持高分，請精益求精，嚴防任何粗心失誤。`;
                    if (score >= 80) return `${subName}有中上水準，但仍需提高考卷作答的專注度。`;
                    if (score >= 60) return `${subName}在及格邊緣，核心觀念仍顯模糊，請及時補強。`;
                    return `${subName}成績已亮紅燈！觀念落後嚴重，請立即進行輔導。`;
                }
            };

            // ================= 動作處理器 =================
            const loadDemoData = async () => {
                if (!firebaseUser) return showToast("未連線", "error");
                const demoList = [
                    { id: "student_A001", seatNo: "A001", name: "王小明", password: "A001", progress: 3.5, scores: { "國文": 85, "英語": 78, "數學": 92, "理化": 86, "歷史": 90, "地理": 82, "公民": 88, "生物": 94 } },
                    { id: "student_A002", seatNo: "A002", name: "陳美玲", password: "A002", progress: 1.0, scores: { "國文": 78, "英語": 84, "數學": 91, "理化": 88, "歷史": 80, "地理": 85, "公民": 82, "生物": 89 } },
                    { id: "student_A003", seatNo: "A003", name: "林志宏", password: "A003", progress: -2.0, scores: { "國文": 65, "英語": 72, "數學": 80, "理化": 84, "歷史": 68, "地理": 70, "公民": 74, "生物": 72 } }
                ];

                try {
                    const { db, doc, setDoc } = window.firebaseAPI;
                    for (const s of demoList) {
                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'submissions', s.id), s);
                    }
                    showToast("已載入展示範例名單！");
                } catch (e) { showToast("載入失敗：" + e.message, "error"); }
            };

            const clearDatabase = async () => {
                if (!firebaseUser) return;
                // 為了避免使用 alert/confirm (違反規定)，在此使用自訂提示，但為簡化且這在 iframe 內，我們直接執行或用自建 Modal。
                // 考量需求，我們暫時使用最簡化的邏輯。
                try {
                    const { db, doc, deleteDoc } = window.firebaseAPI;
                    for (const s of students) {
                        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'submissions', s.id));
                    }
                    showToast("資料庫已清空！");
                } catch (e) { showToast("清空失敗：" + e.message, "error"); }
            };

            const handleExcelUpload = (file) => {
                if (!file || !firebaseUser) return;
                const reader = new FileReader();
                reader.onload = async (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const sheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[sheetName];
                        const json = XLSX.utils.sheet_to_json(worksheet);

                        if (json.length === 0) return showToast("Excel 沒有有效數據！", "error");

                        const parsedStudents = json.map((row, idx) => {
                            const seat = String(row['座號'] || `A${String(idx+1).padStart(3, '0')}`);
                            const studentScores = {};
                            settings.subjects.forEach(sub => {
                                const subName = sub.name;
                                if (row[subName] !== undefined) {
                                    studentScores[subName] = parseFloat(row[subName]) || 0;
                                } else {
                                    const regKey = `${subName}_平時`, exKey = `${subName}_定期`;
                                    if (row[regKey] !== undefined || row[exKey] !== undefined) {
                                        studentScores[subName] = ((parseFloat(row[regKey]) || 0) + (parseFloat(row[exKey]) || 0)) / 2;
                                    } else {
                                        studentScores[subName] = null; // 修改為 null 代表未登記
                                    }
                                }
                            });

                            return {
                                id: `student_${seat}`,
                                seatNo: seat,
                                name: String(row['姓名'] || `同學 ${idx+1}`),
                                password: String(row['密碼'] || seat), 
                                progress: parseFloat(row['進步分數']) || 0,
                                scores: studentScores
                            };
                        });

                        const { db, doc, setDoc } = window.firebaseAPI;
                        for (const s of parsedStudents) {
                            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'submissions', s.id), s);
                        }
                        showToast(`成功匯入 ${parsedStudents.length} 筆成績！`);
                    } catch (err) { showToast("解析失敗：" + err.message, "error"); }
                };
                reader.readAsArrayBuffer(file);
            };

            // Excel 匯出與範本
            const exportGradesToCSV = () => {
                if (students.length === 0) return showToast("沒有資料可以匯出！", "error");
                let csvContent = "\uFEFF座號,姓名,密碼,進步分數";
                settings.subjects.forEach(sub => csvContent += `,${sub.name}`);
                csvContent += ",總平均\r\n";

                students.forEach(s => {
                    let row = `${s.seatNo},"${s.name}","${s.password || ''}",${s.progress || 0}`;
                    settings.subjects.forEach(sub => {
                        const val = getStudentScore(s, sub.name);
                        row += `,${val !== null ? val : ""}`;
                    });
                    row += `,${calculateStudentAvg(s).toFixed(2)}\r\n`;
                    csvContent += row;
                });

                const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.setAttribute("download", `${settings.className}_成績彙整.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("成績彙整匯出成功！");
            };

            const downloadTemplateCSV = () => {
                let csvContent = "\uFEFF座號,姓名,密碼,進步分數";
                settings.subjects.forEach(sub => csvContent += `,${sub.name}`);
                csvContent += "\r\nA001,王小明,A001,3.5";
                settings.subjects.forEach(() => csvContent += ",85");
                csvContent += "\r\n";
                const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.setAttribute("download", "成績匯入範本.csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            // 登入邏輯
            const handleParentLogin = () => {
                const seatStr = String(loginData.seatNo).trim();
                const pwdStr = String(loginData.password).trim();
                const found = students.find(s => String(s.seatNo).trim() === seatStr && String(s.password).trim() === pwdStr);
                if (found) {
                    setCurrentStudent(found);
                    setViewMode('parent-dashboard');
                    showToast(`登入成功！歡迎 ${found.name}！`);
                } else {
                    showToast("座號或密碼輸入錯誤！", "error");
                }
            };

            const handleTeacherLoginOnMain = () => {
                if (teacherPass === "fxm315") {
                    setViewMode('teacher-dashboard');
                    setTeacherPass('');
                    setShowTeacherModal(false);
                    showToast("管理後台登入成功！");
                } else {
                    showToast("密碼錯誤！", "error");
                }
            };

            // 成績編輯與學生管理
            const startEditSubjectScore = (subjectName) => {
                const matchedSubject = settings.subjects.find(s => s.name === subjectName);
                if (matchedSubject?.locked) return showToast("此科目已被鎖定！", "error");
                setEditingSubject(subjectName);
                const currentScore = getStudentScore(currentStudent, subjectName);
                setEditForm({ score: currentScore !== null ? currentScore.toString() : '' });
            };

            const saveStudentScore = async () => {
                if (!firebaseUser || !currentStudent) return;
                const scoreNum = parseFloat(editForm.score);
                if (isNaN(scoreNum) || scoreNum < 0 || scoreNum > 100) return showToast("請輸入 0-100 的成績！", "error");

                try {
                    const { db, doc, setDoc } = window.firebaseAPI;
                    const updatedScores = { ...currentStudent.scores, [editingSubject]: scoreNum };
                    const updatedStudent = { ...currentStudent, scores: updatedScores };

                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'submissions', currentStudent.id), updatedStudent);
                    setCurrentStudent(updatedStudent);
                    setEditingSubject(null);
                    showToast(`${editingSubject} 成績已儲存！`);
                } catch (e) { showToast("儲存失敗：" + e.message, "error"); }
            };

            const handleAddStudent = async () => {
                const seat = String(newStudentData.seatNo).trim();
                const name = String(newStudentData.name).trim();
                const pwd = String(newStudentData.password).trim() || seat;

                if (!seat || !name) return showToast("請填寫座號與姓名！", "error");
                if (students.some(s => String(s.seatNo).trim() === seat)) return showToast("座號重複！", "error");

                try {
                    const { db, doc, setDoc } = window.firebaseAPI;
                    const newId = `student_${seat}`;
                    const studentObj = { id: newId, seatNo: seat, name, password: pwd, progress: 0, scores: {} };
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'submissions', newId), studentObj);
                    setNewStudentData({ seatNo: '', name: '', password: '' });
                    setShowAddStudent(false);
                    showToast(`學生 ${name} 新增成功！`);

                if(!firebaseUser) return;
                try {
                    const { db, doc, deleteDoc } = window.firebaseAPI;
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'submissions', student.id));

            };

            const saveModifiedStudent = async () => {
                if (!firebaseUser || !modifyingStudent) return;
                if (!modifyingStudent.name.trim()) return showToast("姓名不能為空！", "error");
                try {
                    const { db, doc, setDoc } = window.firebaseAPI;
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'submissions', modifyingStudent.id), modifyingStudent);
                    setModifyingStudent(null);
                    showToast("學生資訊已更新！");

            };

            const handleAddSubject = () => {
                const name = newSubjectName === "自訂" ? customSubjectName.trim() : newSubjectName;
                if (!name) return showToast("請輸入科目名稱！", "error");
                if (settings.subjects.some(s => s.name === name)) return showToast("科目已存在！", "error");

                const newSettings = { 
                    ...settings, 
                    subjects: [...settings.subjects, { name, date: newSubjectDate.trim() || "07/05", scope: newSubjectScope.trim() || "未設定", locked: false }] 
                };
                setSettings(newSettings);
                saveSettingsToCloud(newSettings);
                setNewSubjectName('英文'); setCustomSubjectName(''); setNewSubjectScope(''); setNewSubjectDate('');
            };

            const handleDeleteSubject = (subjectName) => {
                const newSettings = { ...settings, subjects: settings.subjects.filter(s => s.name !== subjectName) };
                setSettings(newSettings);
                saveSettingsToCloud(newSettings);
            };

            // SVG 雷達圖生成
            const renderRadarChart = (student) => {
                const subjectsList = settings.subjects;
                if (subjectsList.length < 3) {
                    return (
                        <div className="py-12 text-slate-400 text-xs flex flex-col items-center justify-center gap-1">
                          <span>📊 考科不足 3 科，無法繪製雷達圖</span>
                        </div>
                    );
                }

                const size = 200, center = size / 2, maxRadius = 75, N = subjectsList.length;
                const getCoords = (index, value) => {
                    const angle = (Math.PI * 2 / N) * index - Math.PI / 2;
                    const r = (value / 100) * maxRadius;
                    return { x: center + r * Math.cos(angle), y: center + r * Math.sin(angle) };
                };

                const gridPolygons = [20, 40, 60, 80, 100].map(level => 
                    subjectsList.map((_, i) => `${getCoords(i, level).x},${getCoords(i, level).y}`).join(" ")
                );

                const studentPoints = subjectsList.map((sub, i) => {
                    const score = getStudentScore(student, sub.name) || 0;
                    return `${getCoords(i, score).x},${getCoords(i, score).y}`;
                }).join(" ");

                return (
                    <svg width="220" height="220" className="mx-auto my-2">
                        {gridPolygons.map((pts, idx) => (
                            <polygon key={idx} points={pts} fill="none" stroke="#E2E8F0" strokeWidth="1" />
                        ))}
                        {subjectsList.map((_, i) => {
                            const outer = getCoords(i, 100);
                            return <line key={i} x1={center} y1={center} x2={outer.x} y2={outer.y} stroke="#E2E8F0" strokeWidth="1" />;
                        })}
                        <polygon points={studentPoints} fill="rgba(0, 112, 74, 0.2)" stroke="#00704A" strokeWidth="2" />
                        {subjectsList.map((sub, i) => {
                            const p = getCoords(i, getStudentScore(student, sub.name) || 0);
                            return <circle key={i} cx={p.x} cy={p.y} r="3.5" fill="#00704A" />;
                        })}
                        {subjectsList.map((sub, i) => {
                            const labelPos = getCoords(i, 118);
                            return (
                                <text key={i} x={labelPos.x} y={labelPos.y + 4} textAnchor="middle" className="text-[10px] font-bold fill-slate-600">
                                    {sub.name}
                                </text>
                            );
                        })}
                    </svg>
                );

                                                            </td>
                                                        </tr>

                                                {settings.showTotalAvg && (

                                                <button onClick={saveStudentScore} className="w-full bg-[#00704A] text-white py-2.5 rounded-xl text-xs font-bold transition">💾 儲存並同步</button>

                    {/* ================= 頁面：後台管理 (教師端) ================= */}
                    {viewMode === 'teacher-dashboard' && (
                        <main className="no-print flex-grow p-6 flex flex-col xl:flex-row gap-6 max-w-[1600px] w-full mx-auto animate-fade-in">

                                            return (
                                                <label key={prop} className="flex items-center gap-2.5 cursor-pointer text-xs font-bold text-slate-600">
                                                    <input type="checkbox" checked={settings[prop]} onChange={e => { const s = {...settings, [prop]: e.target.checked}; setSettings(s); saveSettingsToCloud(s); }} className="rounded text-[#00704A]" />
                                                    <span>{label}</span>
                                                </label>
                                            )
                                        })}
                                    </div>
                                </div>
                            </div>

                            {/* 右側學生名冊區 */}
                            <div className="flex-grow flex flex-col gap-5">
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
                                    <div onDragOver={e=>{e.preventDefault();setExcelDragActive(true);}} onDragLeave={()=>setExcelDragActive(false)} onDrop={e=>{e.preventDefault();setExcelDragActive(false);handleExcelUpload(e.dataTransfer.files[0]);}} className={`p-8 border-2 border-dashed rounded-[2rem] text-center flex flex-col items-center justify-center transition ${excelDragActive ? 'border-[#00704A] bg-emerald-50' : 'bg-white'}`}>
                                        <span className="text-4xl mb-2">📁</span>
                                        <h4 className="font-bold text-sm">拖放 Excel 批次匯入成績</h4>
                                        <div className="flex flex-wrap gap-2 mt-4 justify-center">
                                            <button onClick={() => fileInputRef.current.click()} className="bg-[#00704A] text-white text-xs px-3.5 py-2 rounded-xl">選取檔案</button>
                                            <button onClick={loadDemoData} className="bg-[#CBA258] text-white text-xs px-3.5 py-2 rounded-xl">載入範例</button>
                                            <button onClick={clearDatabase} className="bg-slate-100 text-slate-600 text-xs px-3.5 py-2 rounded-xl border">清空資料</button>
                                            <button onClick={exportGradesToCSV} className="bg-blue-600 text-white text-xs px-3.5 py-2 rounded-xl">💾 匯出 CSV</button>
                                        </div>
                                        <input type="file" ref={fileInputRef} className="hidden" accept=".xlsx, .csv" onChange={e => handleExcelUpload(e.target.files[0])} />
                                    </div>

                                    <div className="bg-white p-6 rounded-[2rem] border shadow-xl grid grid-cols-2 sm:grid-cols-3 gap-4">
                                        <div className="bg-slate-50 p-4 rounded-2xl border">
                                            <span className="block text-[10px] font-bold">總學生數</span>
                                            <span className="block text-2xl font-black text-[#00704A] mt-1">{students.length}</span>
                                        </div>
                                        <div className="bg-slate-50 p-4 rounded-2xl border">
                                            <span className="block text-[10px] font-bold">已設科目</span>
                                            <span className="block text-2xl font-black mt-1">{settings.subjects.length}</span>
                                        </div>
                                        <div className="bg-slate-50 p-4 rounded-2xl border">
                                            <span className="block text-[10px] font-bold">班級總平均</span>
                                            <span className="block text-2xl font-black text-indigo-700 mt-1">{stats.avg.toFixed(1)}</span>
                                        </div>
                                        <div className="bg-slate-50 p-4 rounded-2xl border col-span-2 sm:col-span-3 flex justify-between items-center">
                                            <div className="text-xs text-slate-500 font-bold">A級:{stats.A} | B級:{stats.B} | C級:{stats.C}</div>
                                            <button onClick={downloadTemplateCSV} className="text-xs text-[#00704A] underline font-bold">下載匯入範本</button>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-white rounded-[2rem] border shadow-xl overflow-hidden">
                                    <div className="p-5 border-b flex justify-between items-center bg-slate-50">
                                        <h4 className="font-black">班級名冊與成績總覽</h4>
                                        <button onClick={() => setShowAddStudent(!showAddStudent)} className="bg-[#00704A] text-white text-xs font-bold px-3 py-1.5 rounded-xl">{showAddStudent ? "❌ 取消" : "➕ 手動新增學生"}</button>
                                    </div>

                                    {showAddStudent && (
                                        <div className="p-5 bg-emerald-50/50 flex flex-wrap gap-4 items-end animate-fade-in">
                                            <div className="w-full sm:w-1/4">
                                                <input type="text" placeholder="座號 (例:A01)" className="w-full p-2 bg-white border rounded-lg text-xs" value={newStudentData.seatNo} onChange={e => setNewStudentData({...newStudentData, seatNo: e.target.value})} />
                                            </div>
                                            <div className="w-full sm:w-1/4">
                                                <input type="text" placeholder="姓名" className="w-full p-2 bg-white border rounded-lg text-xs" value={newStudentData.name} onChange={e => setNewStudentData({...newStudentData, name: e.target.value})} />
                                            </div>
                                            <div className="w-full sm:w-1/4">
                                                <input type="text" placeholder="密碼(預設同座號)" className="w-full p-2 bg-white border rounded-lg text-xs" value={newStudentData.password} onChange={e => setNewStudentData({...newStudentData, password: e.target.value})} />
                                            </div>
                                            <button onClick={handleAddStudent} className="bg-[#00704A] text-white text-xs px-4 py-2 rounded-lg font-bold">確定新增</button>
                                        </div>
                                    )}

                                    <div className="overflow-x-auto">
                                        <table className="min-w-full text-center text-xs">
                                            <thead className="bg-slate-100">
                                                <tr>
                                                    <th className="px-4 py-3 font-bold pl-6">座號</th>
                                                    <th className="px-4 py-3 font-bold">姓名</th>
                                                    {settings.subjects.map(sub => <th key={sub.name} className="px-3 py-3 font-bold">{sub.name}</th>)}
                                                    <th className="px-4 py-3 font-bold">平均</th>
                                                    <th className="px-4 py-3 font-bold">進步</th>
                                                    <th className="px-4 py-3 font-bold text-right pr-6">操作</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 font-medium">
                                                {students.map((s, idx) => (
                                                    <tr key={idx} className="hover:bg-slate-50">
                                                        <td className="px-4 py-3.5 pl-6 font-bold text-[#00704A]">{s.seatNo}</td>
                                                        <td className="px-4 py-3.5 font-bold">{s.name}</td>
                                                        {settings.subjects.map(sub => {
                                                            const sc = getStudentScore(s, sub.name);
                                                            const avg = calculateClassSubjectAvg(sub.name);
                                                            const isB = sc !== null && avg > 0 && sc < avg;
                                                            return <td key={sub.name} className={`px-3 py-3.5 ${isB ? 'text-rose-600 font-bold bg-rose-50/20' : 'text-slate-500'}`}>{sc !== null ? sc.toFixed(1) : "-"}</td>
                                                        })}
                                                        <td className="px-4 py-3.5 font-extrabold text-[#00704A]">{calculateStudentAvg(s).toFixed(1)}</td>
                                                        <td className={`px-4 py-3.5 font-bold ${s.progress>=0?'text-emerald-600':'text-rose-500'}`}>{s.progress}</td>
                                                        <td className="px-4 py-3.5 text-right pr-6 whitespace-nowrap">
                                                            <button onClick={() => setModifyingStudent(s)} className="text-blue-600 mr-2">📝</button>
                                                            <button onClick={() => handleDeleteStudent(s)} className="text-rose-600 mr-2">🗑️</button>
                                                            <button onClick={() => { setCurrentStudent(s); setViewMode('parent-dashboard'); }} className="text-[#00704A]">🔎</button>
                                                        </td>
                                                    </tr>
                                                ))}
                                                {students.length === 0 && <tr><td colSpan="10" className="py-8 text-slate-400">尚無學生資料</td></tr>}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>

                            {/* 學生單一編輯 Modal */}
                            {modifyingStudent && (
                                <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 p-4">
                                    <div className="bg-white rounded-3xl w-full max-w-2xl p-6 flex flex-col gap-4 max-h-[90vh]">
                                        <div className="flex justify-between items-center border-b pb-3">
                                            <h3 className="font-bold">📝 編輯：{modifyingStudent.name}</h3>
                                            <button onClick={() => setModifyingStudent(null)} className="text-slate-400">關閉</button>
                                        </div>
                                        <div className="overflow-y-auto pr-1 space-y-4">
                                            <div className="grid grid-cols-3 gap-4 bg-slate-50 p-4 rounded-2xl">
                                                <div><label className="text-[10px] text-slate-500">姓名</label><input type="text" className="w-full p-2 border rounded-xl text-sm" value={modifyingStudent.name} onChange={e=>setModifyingStudent({...modifyingStudent, name:e.target.value})}/></div>
                                                <div><label className="text-[10px] text-slate-500">密碼</label><input type="text" className="w-full p-2 border rounded-xl text-sm" value={modifyingStudent.password} onChange={e=>setModifyingStudent({...modifyingStudent, password:e.target.value})}/></div>
                                                <div><label className="text-[10px] text-slate-500">進步分數</label><input type="number" className="w-full p-2 border rounded-xl text-sm" value={modifyingStudent.progress} onChange={e=>setModifyingStudent({...modifyingStudent, progress:parseFloat(e.target.value)||0})}/></div>
                                            </div>
                                            <div className="grid grid-cols-2 gap-3">
                                                {settings.subjects.map(sub => (
                                                    <div key={sub.name} className="bg-stone-50 p-2 rounded-xl flex justify-between items-center">
                                                        <span className="text-xs font-bold text-[#00704A]">{sub.name}</span>
                                                        <input type="number" className="w-20 p-1 border rounded text-xs text-center" value={getStudentScore(modifyingStudent, sub.name) ?? ''} onChange={e=>{
                                                            const val = e.target.value === '' ? '' : parseFloat(e.target.value);
                                                            setModifyingStudent({...modifyingStudent, scores: {...(modifyingStudent.scores||{}), [sub.name]: val}});
                                                        }} />
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                        <div className="flex justify-end gap-2 pt-3 border-t">
                                            <button onClick={() => setModifyingStudent(null)} className="px-4 py-2 border rounded-xl text-xs">取消</button>
                                            <button onClick={saveModifiedStudent} className="bg-[#00704A] text-white px-5 py-2 rounded-xl text-xs font-bold">儲存</button>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </main>
                    )}

                    {/* 教師管理登入 Modal */}
                    {showTeacherModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 p-4" onClick={() => setShowTeacherModal(false)}>
                            <div className="bg-white w-full max-w-sm rounded-3xl p-6" onClick={e => e.stopPropagation()}>
                                <h3 className="text-lg font-bold text-center mb-4">🔑 教師身分驗證</h3>
                                <input type="password" placeholder="請輸入管理密碼" className="w-full bg-slate-50 border rounded-2xl px-4 py-3 text-sm mb-4" value={teacherPass} onChange={e => setTeacherPass(e.target.value)} onKeyDown={e => e.key==='Enter' && handleTeacherLoginOnMain()} />
                                <div className="flex gap-2">
                                    <button onClick={() => setShowTeacherModal(false)} className="flex-1 bg-slate-100 py-3 rounded-2xl text-sm">取消</button>
                                    <button onClick={handleTeacherLoginOnMain} className="flex-1 bg-[#00704A] text-white py-3 rounded-2xl text-sm font-bold">登入</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
