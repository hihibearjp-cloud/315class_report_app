<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>班級上學打卡鐘</title>
  
  <!-- iOS PWA Meta Tags & Apple Touch Icon -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="打卡聯絡簿">
  <link rel="apple-touch-icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="%239B59B6"/><text x="256" y="270" font-size="280" text-anchor="middle" dominant-baseline="central">⏰</text></svg>'>
  <link rel="shortcut icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="%239B59B6"/><text x="256" y="270" font-size="280" text-anchor="middle" dominant-baseline="central">⏰</text></svg>'>

  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 引入 Babel 來在瀏覽器編譯 JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* 隱藏捲軸但保留滾動功能，讓畫面更像 App */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    body { -webkit-tap-highlight-color: transparent; }
    
    /* 自訂閃爍紅底動畫 */
    @keyframes flash-bg {
      0%, 100% { background-color: #ef4444; border-color: #b91c1c; box-shadow: 0 0 20px rgba(239, 68, 68, 0.6); }
      50% { background-color: #991b1b; border-color: #7f1d1d; box-shadow: 0 0 5px rgba(153, 27, 27, 0.3); }
    }
    .flash-red-container {
      animation: flash-bg 1.5s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- 使用 type="text/babel" 搭配 data-type="module" 支援 ES6 Import -->
    <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from 'https://esm.sh/react@18';
    import { createRoot } from 'https://esm.sh/react-dom@18/client';
    import { 
      UserCheck, BookOpen, Settings, ChevronLeft, ChevronRight, 
      Calendar, Users, FileText, CheckCircle2, FileSpreadsheet, 
      Download, ClipboardList, Zap, Trash2, Eye, EyeOff, 
      MessageSquare, Smartphone, X, Star, Plus, Minus,
      MonitorPlay, Minimize2, AlertTriangle, Edit2, Check
    } from 'https://esm.sh/lucide-react@0.292.0';

    // ----------------------------------------------------------------------
    // 輔助函式
    // ----------------------------------------------------------------------
    const getLocalTodayStr = () => {
      const d = new Date();
      d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      return d.toISOString().split('T')[0];
    };

    const getWeekday = (dateStr) => {
      if (!dateStr) return '';
      const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      return days[new Date(dateStr).getDay()];
    };

    // 韓式文具粉嫩馬卡龍色系對應表
    const COLOR_MAP = {
      amber: { bg: 'bg-[#FFF4D2] dark:bg-[#4A4022]', text: 'text-[#D4A017] dark:text-[#FFE37A]', border: 'border-[#FFE37A]', borderB: 'border-b-[#FFE37A]', shadow: 'shadow-[0_4px_0_0_#FFE37A]', badge: 'bg-[#FFD94D]' },
      rose: { bg: 'bg-[#FFE5E5] dark:bg-[#4A2B2B]', text: 'text-[#D9534F] dark:text-[#FFB3B3]', border: 'border-[#FFB3B3]', borderB: 'border-b-[#FFB3B3]', shadow: 'shadow-[0_4px_0_0_#FFB3B3]', badge: 'bg-[#FF8FA3]' },
      sky: { bg: 'bg-[#E5F3FF] dark:bg-[#2B3A4A]', text: 'text-[#4A90E2] dark:text-[#B3D4FF]', border: 'border-[#B3D4FF]', borderB: 'border-b-[#B3D4FF]', shadow: 'shadow-[0_4px_0_0_#B3D4FF]', badge: 'bg-[#82C3FF]' },
      orange: { bg: 'bg-[#FFEADB] dark:bg-[#4A3222]', text: 'text-[#E27C3E] dark:text-[#FFC7A1]', border: 'border-[#FFC7A1]', borderB: 'border-b-[#FFC7A1]', shadow: 'shadow-[0_4px_0_0_#FFC7A1]', badge: 'bg-[#FFB07A]' },
      purple: { bg: 'bg-[#F2E5FF] dark:bg-[#3B2B4A]', text: 'text-[#9B59B6] dark:text-[#D9B3FF]', border: 'border-[#D9B3FF]', borderB: 'border-b-[#D9B3FF]', shadow: 'shadow-[0_4px_0_0_#D9B3FF]', badge: 'bg-[#C58CFF]' },
      emerald: { bg: 'bg-[#E5FFE9] dark:bg-[#2B4A31]', text: 'text-[#2ECC71] dark:text-[#A1FFBB]', border: 'border-[#A1FFBB]', borderB: 'border-b-[#A1FFBB]', shadow: 'shadow-[0_4px_0_0_#A1FFBB]', badge: 'bg-[#6EE39A]' }
    };

    // 獨立出來的日期切換列元件
    const DateBar = ({ selectedDate, setSelectedDate, changeDate }) => (
      <div className="flex items-center justify-between bg-white dark:bg-[#1e1e1e] p-3.5 sm:p-4 rounded-[24px] shadow-[0_4px_0_0_#E9ECEF] dark:shadow-[0_4px_0_0_#333] border-2 border-[#E9ECEF] dark:border-[#333] mb-6">
        <button onClick={() => changeDate(-1)} className="px-4 py-2 rounded-[20px] bg-[#F8F9FA] dark:bg-[#2c2c2c] border-2 border-[#E9ECEF] dark:border-[#444] text-gray-600 dark:text-gray-300 shadow-[0_4px_0_0_#E9ECEF] dark:shadow-[0_4px_0_0_#444] hover:-translate-y-1 active:translate-y-1 active:shadow-none transition-all flex items-center gap-1 text-sm font-bold">
          <ChevronLeft size={18} /> 前一天
        </button>

        <div className="flex flex-col items-center">
          <div className="flex items-center gap-2">
            <Calendar size={18} className="text-[#C58CFF]" />
            <input 
              type="date" 
              value={selectedDate}
              onChange={(e) => setSelectedDate(e.target.value)}
              className="bg-transparent text-base sm:text-lg font-black outline-none cursor-pointer dark:[color-scheme:dark] text-gray-700 dark:text-gray-200"
            />
          </div>
          <div className="flex items-center gap-2 mt-1">
            <span className="text-xs text-[#9B59B6] font-bold bg-[#F2E5FF] dark:bg-[#3B2B4A] border border-[#D9B3FF] px-3 py-0.5 rounded-full">
              {getWeekday(selectedDate)}
            </span>
            {selectedDate !== getLocalTodayStr() && (
              <button 
                onClick={() => setSelectedDate(getLocalTodayStr())}
                className="text-[11px] font-bold text-[#D4A017] bg-[#FFF4D2] hover:bg-[#FFE8A1] dark:bg-[#4A4022] px-3 py-0.5 rounded-full border border-[#FFE37A] transition-colors"
              >
                回到今天
              </button>
            )}
          </div>
        </div>

        <button onClick={() => changeDate(1)} className="px-4 py-2 rounded-[20px] bg-[#F8F9FA] dark:bg-[#2c2c2c] border-2 border-[#E9ECEF] dark:border-[#444] text-gray-600 dark:text-gray-300 shadow-[0_4px_0_0_#E9ECEF] dark:shadow-[0_4px_0_0_#444] hover:-translate-y-1 active:translate-y-1 active:shadow-none transition-all flex items-center gap-1 text-sm font-bold">
          後一天 <ChevronRight size={18} />
        </button>
      </div>
    );

    // ----------------------------------------------------------------------
    // 主程式 App Component
    // ----------------------------------------------------------------------
    function App() {
      // 讀取網址參數，判斷是否為家長專屬網址模式
      const urlParams = new URLSearchParams(window.location.search);
      const isParentMode = urlParams.get('mode') === 'parent';

      const [currentPage, setCurrentPage] = useState(isParentMode ? 'homework' : 'attendance');
      const [selectedDate, setSelectedDate] = useState(getLocalTodayStr());
      const [quickNotice, setQuickNotice] = useState("");
      const [students, setStudents] = useState([]);
      
      // 標籤設定 (依需求預設)
      const [customTags, setCustomTags] = useState([
        { id: 'tag_late', name: '遲到', color: 'amber' },
        { id: 'tag_absent', name: '缺席', color: 'rose' },
        { id: 'tag_leave', name: '事假', color: 'sky' },
        { id: 'tag_sick', name: '病假', color: 'emerald' }
      ]);

      const [homeworkData, setHomeworkData] = useState({
        homework: ['國文習作 P.12-14', '數學練習簿 第8回'],
        exam: ['明早考國文第一課', '數學第三單元練習卷'],
        notice: ['【攜帶】明天記得穿運動服', '【回條】流感疫苗接種同意書', '【攜帶】記得帶彩色筆和三角板'],
        missing: [{ subject: '國文', title: '國文習作 P.12', studentIds: [1, 5] }]
      });
      const [gradeSubjects, setGradeSubjects] = useState(["國文"]);

      // 新增：班級叮嚀類別與編輯狀態
      const [noticeType, setNoticeType] = useState('回條');
      const [noticeInput, setNoticeInput] = useState('');
      const noticeCategories = ['回條', '攜帶', '提醒', '重要'];
      const [editingItem, setEditingItem] = useState({ category: '', index: -1, text: '' });

      // 新增：缺交作業專用的表單狀態
      const [missingForm, setMissingForm] = useState({ subject: '國文', title: '', studentIds: [] });

      const [hiddenBlocks, setHiddenBlocks] = useState([]);
      const [isTvMode, setIsTvMode] = useState(false);
      const [isParentView, setIsParentView] = useState(isParentMode);

      // 新增：聯絡簿頁面密碼驗證狀態
      const [isHomeworkAuthenticated, setIsHomeworkAuthenticated] = useState(false);
      const [showHwLoginModal, setShowHwLoginModal] = useState(false);
      const [hwPasswordInput, setHwPasswordInput] = useState('');
      const [hwPassword, setHwPassword] = useState('1234'); // 聯絡簿預設密碼

      const toggleBlock = (blockId) => {
        setHiddenBlocks(prev => prev.includes(blockId) ? prev.filter(id => id !== blockId) : [...prev, blockId]);
      };

      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [passwordInput, setPasswordInput] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      
      const [adminPassword, setAdminPassword] = useState('1234');
      const [oldPasswordInput, setOldPasswordInput] = useState('');
      const [newPasswordInput, setNewPasswordInput] = useState('');
      const [newHwPasswordInput, setNewHwPasswordInput] = useState('');

      const [manualStudentCountInput, setManualStudentCountInput] = useState(30);
      const [pasteNameInput, setPasteNameInput] = useState('');
      const [newTagName, setNewTagName] = useState('');
      const [newTagColor, setNewTagColor] = useState('sky');
      const [isExportingCsv, setIsExportingCsv] = useState(false);

      // 科目設定
      const [availableSubjects, setAvailableSubjects] = useState(['國文', '英語', '數學', '生物', '理化', '地科', '歷史', '地理', '公民']);
      const [newSubjectInput, setNewSubjectInput] = useState('');

      const [selectedStudent, setSelectedStudent] = useState(null);
      const [showLeaveModal, setShowLeaveModal] = useState(false);
      const [leaveReasonInput, setLeaveReasonInput] = useState("");
      const [pendingLeaveTag, setPendingLeaveTag] = useState(null);

      useEffect(() => {
        const initStudents = Array.from({ length: 30 }, (_, i) => ({
          id: i + 1,
          name: `學生${i + 1}`,
          status: 'pending',
          checkTime: '',
          activeTags: [],
          leaveReason: ''
        }));
        setStudents(initStudents);
      }, []);

      const showToast = (msg) => {
        setQuickNotice(msg);
        setTimeout(() => setQuickNotice(""), 3000);
      };

      const handleCopyToClipboard = (text, method) => {
        try {
            const successMsg = method === '專屬網址' ? '✅ 網址已複製！請貼給家長' : `✅ 已複製訊息，請前往 ${method} 貼上發送`;
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text);
                showToast(successMsg);
            } else {
                let textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                textArea.style.left = "-999999px";
                textArea.style.top = "-999999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                document.execCommand('copy');
                textArea.remove();
                showToast(successMsg);
            }
        } catch (err) {
            showToast("❌ 複製失敗");
        }
      };

      const handleCopyParentLink = () => {
        const url = new URL(window.location.href);
        url.searchParams.set('mode', 'parent');
        handleCopyToClipboard(url.toString(), '專屬網址');
      };

      const changeDate = (days) => {
        try {
          const d = new Date(selectedDate);
          d.setDate(d.getDate() + days);
          setSelectedDate(d.toISOString().split('T')[0]);
        } catch (e) {
          setSelectedDate(getLocalTodayStr());
        }
      };

      const updateStudentData = (studentId, newData) => {
        setStudents(prev => prev.map(s => s.id === studentId ? { ...s, ...newData } : s));
      };

      const handleStudentClick = (student) => {
        setSelectedStudent(student);
      };

      const toggleStudentTag = (tagId) => {
        if (!selectedStudent) return;
        const tag = customTags.find(t => t.id === tagId);
        if (!tag) return;
        
        const activeTags = selectedStudent.activeTags || [];
        const isCurrentlyActive = activeTags.includes(tagId);

        // 只有當標籤名稱包含「病假」，且目前未被選中時，才彈出視窗要求填寫原因
        if (!isCurrentlyActive && tag.name.includes('病假')) {
          setPendingLeaveTag(tagId);
          setLeaveReasonInput("");
          setShowLeaveModal(true);
        } else {
          let newTags = isCurrentlyActive ? activeTags.filter(id => id !== tagId) : [...activeTags, tagId];
          let newReason = selectedStudent.leaveReason || "";
          if (isCurrentlyActive && tag.name.includes('病假')) newReason = ""; 
          
          const now = new Date();
          const checkTime = selectedStudent.checkTime || now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
          const updated = { 
            ...selectedStudent, activeTags: newTags, leaveReason: newReason, 
            status: newTags.length > 0 ? 'tagged' : 'onTime', checkTime 
          };
          setSelectedStudent(updated);
          updateStudentData(updated.id, updated);
        }
      };

      const submitLeaveReason = () => {
        if (!pendingLeaveTag || !selectedStudent) return;
        const newTags = [...(selectedStudent.activeTags || []), pendingLeaveTag];
        const now = new Date();
        const checkTime = selectedStudent.checkTime || now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
        const updated = {
          ...selectedStudent, activeTags: newTags, leaveReason: leaveReasonInput,
          status: 'tagged', checkTime
        };
        setSelectedStudent(updated);
        updateStudentData(updated.id, updated);
        setShowLeaveModal(false);
        setPendingLeaveTag(null);
      };

      const clearAllStatus = () => {
        if (!selectedStudent) return;
        const updated = { ...selectedStudent, status: 'pending', checkTime: '', activeTags: [], leaveReason: "" };
        setSelectedStudent(updated);
        updateStudentData(updated.id, updated);
      };

      const markAsOnTime = () => {
        if (!selectedStudent) return;
        const now = new Date();
        const nowStr = now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
        const updated = { ...selectedStudent, status: 'onTime', checkTime: nowStr, activeTags: [], leaveReason: "" };
        setSelectedStudent(updated);
        updateStudentData(updated.id, updated);
      };

      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (passwordInput === adminPassword) {
          setIsAuthenticated(true);
          setPasswordInput('');
        } else {
          showToast("❌ 密碼錯誤");
        }
      };

      const handleUpdatePassword = () => {
        if (oldPasswordInput !== adminPassword) {
          showToast("❌ 原密碼錯誤！");
          return;
        }
        if (newPasswordInput.length < 4) {
           showToast("❌ 新密碼請至少輸入 4 碼");
           return;
        }
        setAdminPassword(newPasswordInput);
        setOldPasswordInput('');
        setNewPasswordInput('');
        showToast("✅ 密碼修改成功！下次請使用新密碼登入");
      };

      const handleUpdateHwPassword = () => {
        if (newHwPasswordInput.length < 4) {
           showToast("❌ 新密碼請至少輸入 4 碼");
           return;
        }
        setHwPassword(newHwPasswordInput);
        setNewHwPasswordInput('');
        showToast("✅ 聯絡簿密碼修改成功！");
      };

      const handleMarkUnselectedAsOnTime = () => {
        const now = new Date();
        const nowStr = now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
        const updatedStudents = students.map(s => {
          if (s.status === 'pending' && (!s.activeTags || s.activeTags.length === 0)) {
            return { ...s, status: 'onTime', checkTime: nowStr };
          }
          return s;
        });
        setStudents(updatedStudents);
        showToast("✅ 已將未打卡學生設為準時");
      };

      const handleExportFullExcelCsv = () => {
        setIsExportingCsv(true);
        try {
          let csvContent = "\uFEFF座號,姓名,日期,狀態,打卡時間,請假原因\n";
          students.forEach(s => {
            const tags = (s.activeTags || []).map(tid => customTags.find(t=>t.id===tid)?.name).filter(Boolean).join(' / ');
            const statusText = tags ? tags : (s.status === 'onTime' ? '準時' : '未打卡');
            csvContent += `${s.id},${s.name},${selectedDate},${statusText},${s.checkTime || ''},${s.leaveReason || ''}\n`;
          });
          const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.setAttribute("href", url);
          link.setAttribute("download", `班級出缺席總表_${selectedDate}.csv`);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          showToast("📥 報表下載完成");
        } catch (e) {
          showToast("❌ 匯出失敗");
        }
        setIsExportingCsv(false);
      };

      const handleBatchPasteStudents = () => {
        if (!pasteNameInput.trim()) return;
        const names = pasteNameInput.split('\n').map(n => n.trim()).filter(n => n);
        const newStudents = names.map((name, idx) => ({
          id: idx + 1, name: name, status: 'pending', checkTime: '', activeTags: [], leaveReason: ''
        }));
        setStudents(newStudents);
        setManualStudentCountInput(newStudents.length);
        setPasteNameInput("");
        showToast(`✅ 已成功匯入 ${newStudents.length} 名學生`);
      };

      const handleApplyStudentCount = () => {
        const count = parseInt(manualStudentCountInput, 10);
        if (isNaN(count) || count < 1) return showToast("人數必須大於 0");
        let newStudents = [...students];
        if (count > students.length) {
          for (let i = students.length; i < count; i++) {
            newStudents.push({ id: i + 1, name: `學生${i + 1}`, status: 'pending', checkTime: '', activeTags: [], leaveReason: '' });
          }
        } else if (count < students.length) {
          newStudents = newStudents.slice(0, count);
        }
        setStudents(newStudents);
        showToast(`✅ 班級人數已調整為 ${count} 人`);
      };

      const handleAddCustomTag = () => {
        if (!newTagName.trim()) return;
        const newTag = { id: `tag_${Date.now()}`, name: newTagName.trim(), color: newTagColor };
        setCustomTags([...customTags, newTag]);
        setNewTagName("");
        showToast("✅ 標籤新增成功");
      };

      const removeCustomTag = (id) => {
        setCustomTags(customTags.filter(t => t.id !== id));
      };

      const handleAddHomeworkItem = (category, value) => {
        if (!value.trim()) return;
        setHomeworkData(prev => ({ ...prev, [category]: [...(prev[category] || []), value.trim()] }));
      };

      const removeHomeworkItem = (category, idx) => {
        setHomeworkData(prev => ({ ...prev, [category]: (prev[category] || []).filter((_, i) => i !== idx) }));
      };

      const handleStartEdit = (category, idx, text) => {
        setEditingItem({ category, index: idx, text });
      };

      const handleSaveEdit = () => {
        if (!editingItem.text.trim() || editingItem.index === -1) {
            setEditingItem({ category: '', index: -1, text: '' });
            return;
        }
        setHomeworkData(prev => {
          const newData = { ...prev };
          newData[editingItem.category][editingItem.index] = editingItem.text;
          return newData;
        });
        setEditingItem({ category: '', index: -1, text: '' });
      };

      // 新增：處理加入缺交作業名單的邏輯
      const handleAddMissingItem = () => {
        if (!missingForm.title.trim() && missingForm.studentIds.length === 0) {
            showToast("❌ 請填寫作業名稱或選擇缺交座號");
            return;
        }
        setHomeworkData(prev => ({
            ...prev,
            missing: [...(prev.missing || []), { ...missingForm }]
        }));
        // 送出後清空表單，但保留剛選的科目
        setMissingForm(prev => ({ ...prev, title: '', studentIds: [] }));
      };

      // 新增：雙擊座號將其從缺交名單移除
      const handleRemoveMissingStudent = (missingIndex, studentId) => {
        setHomeworkData(prev => {
            const newMissing = [...(prev.missing || [])];
            if (newMissing[missingIndex] && typeof newMissing[missingIndex] === 'object') {
               const updatedItem = { ...newMissing[missingIndex] };
               updatedItem.studentIds = updatedItem.studentIds.filter(id => id !== studentId);
               newMissing[missingIndex] = updatedItem;
            }
            return { ...prev, missing: newMissing };
        });
        showToast(`✅ 座號 ${studentId} 已標記為繳交`);
      };

      const toggleGradeSubject = (subject) => {
        setGradeSubjects(prev =>
          prev.includes(subject) ? prev.filter(s => s !== subject) : [...prev, subject]
        );
      };

      const handleAddSubject = () => {
        if (!newSubjectInput.trim()) return;
        if (availableSubjects.includes(newSubjectInput.trim())) {
          showToast("❌ 科目已存在");
          return;
        }
        setAvailableSubjects([...availableSubjects, newSubjectInput.trim()]);
        setNewSubjectInput('');
        showToast("✅ 科目新增成功");

                        <div className="flex flex-wrap gap-2">
                           {customTags.map(tag => {
                             const c = COLOR_MAP[tag.color] || COLOR_MAP.sky;
                             return (
                               <div key={tag.id} className={`flex items-center gap-1 ${c.bg} ${c.text} border-2 ${c.border} px-3 py-1.5 rounded-[16px] font-bold text-sm shadow-[0_2px_0_0_rgba(0,0,0,0.1)]`}>
                                 {tag.name}
                                 <button onClick={() => removeCustomTag(tag.id)} className="ml-1 opacity-50 hover:opacity-100 p-1 bg-black/10 rounded-full transition-opacity"><X size={12}/></button>
                               </div>
                             );
                           })}
                        </div>
                        
                        <div className="bg-[#F8F9FA] dark:bg-[#2c2c2c] p-4 rounded-[24px] border-2 border-[#E9ECEF] dark:border-[#444]">
                           <h4 className="text-sm font-bold text-gray-600 dark:text-gray-400 mb-3">新增自訂標籤</h4>
                           <div className="flex gap-2 mb-3">
                             <input type="text" value={newTagName} onChange={e=>setNewTagName(e.target.value)} placeholder="標籤名稱" className="flex-1 bg-white dark:bg-[#1e1e1e] border-2 border-[#E9ECEF] dark:border-[#444] rounded-[16px] px-3 py-2 font-bold outline-none" />
                             <select value={newTagColor} onChange={e=>setNewTagColor(e.target.value)} className="bg-white dark:bg-[#1e1e1e] border-2 border-[#E9ECEF] dark:border-[#444] rounded-[16px] px-2 py-2 font-bold outline-none">
                               {Object.keys(COLOR_MAP).map(key => <option key={key} value={key}>{key}</option>)}
                             </select>
                           </div>
                           <button onClick={handleAddCustomTag} className="w-full bg-[#FFD94D] text-[#4A4022] font-black py-2 rounded-[16px] shadow-[0_4px_0_0_#D4A017] hover:-translate-y-0.5 active:translate-y-0.5 active:shadow-none transition-all flex justify-center items-center gap-1"><Plus size={18}/> 新增標籤</button>
                        </div>
                     </div>

                     {/* 科目管理 */}
                     <div className="bg-white dark:bg-[#1e1e1e] p-6 rounded-[36px] shadow-[0_4px_0_0_#E9ECEF] border-2 border-[#E9ECEF] dark:border-[#333] space-y-6">
                        <h3 className="text-xl font-black text-gray-700 dark:text-gray-200 flex items-center gap-2"><BookOpen size={24} className="text-[#FF8FA3]"/> 聯絡簿科目管理</h3>
                        
                        <div className="flex flex-wrap gap-2">
                           {availableSubjects.map(sub => (
                             <div key={sub} className="flex items-center gap-1 bg-[#FFE5E5] text-[#D9534F] border-2 border-[#FFB3B3] px-3 py-1.5 rounded-[16px] font-bold text-sm shadow-[0_2px_0_0_#FFB3B3]">
                               {sub}
                               <button onClick={() => removeSubject(sub)} className="ml-1 opacity-50 hover:opacity-100 p-1 bg-black/10 rounded-full transition-opacity"><X size={12}/></button>
                             </div>
                           ))}
                        </div>
                        
                        <div className="flex gap-2">
                           <input type="text" value={newSubjectInput} onChange={e=>setNewSubjectInput(e.target.value)} placeholder="新科目名稱" className="flex-1 bg-[#F8F9FA] dark:bg-[#2c2c2c] border-2 border-[#E9ECEF] dark:border-[#444] rounded-[16px] px-4 py-2 font-bold focus:border-[#FF8FA3] outline-none" />
                           <button onClick={handleAddSubject} className="bg-[#FF8FA3] text-white font-bold py-2 px-6 rounded-[16px] shadow-[0_4px_0_0_#D9534F] hover:-translate-y-0.5 active:translate-y-0.5 active:shadow-none transition-all">新增</button>
                        </div>
                     </div>

                  </div>
                )}
              </div>
            )}
          </main>

          {}
          {/* Selected Student Modal */}
          {selectedStudent && !showLeaveModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm transition-opacity" onClick={() => setSelectedStudent(null)}>
              <div className="bg-white rounded-[24px] p-6 w-full max-w-md shadow-2xl relative flex flex-col max-h-[90vh] overflow-y-auto transform transition-all scale-100" onClick={e => e.stopPropagation()}>
                
                <h2 className="text-xl font-bold text-[#8E7CC3] mb-4 text-center">
                  修改與聯絡：{selectedStudent.id}號 - {selectedStudent.name}
                </h2>

                {/* Tags */}
                <div className="mb-4">
                  <p className="text-sm text-gray-600 mb-2 font-bold">點選切換狀態標籤 (可複選)：</p>
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 sm:gap-3">
                    {customTags.map(tag => {
                      const isActive = (selectedStudent.activeTags || []).includes(tag.id);
                      let baseClass = "py-2 px-1 rounded-lg border-2 text-center text-sm font-bold transition-all ";
                      switch (tag.color) {
                          case 'rose': 
                              baseClass += (isActive ? "bg-[#EF4444] text-white border-[#EF4444]" : "bg-white text-[#EF4444] border-[#EF4444]"); break;
                          case 'sky': 
                              baseClass += (isActive ? "bg-[#3B82F6] text-white border-[#3B82F6]" : "bg-white text-[#3B82F6] border-[#3B82F6]"); break;
                          case 'amber': 
                          case 'orange':
                              baseClass += (isActive ? "bg-[#F97316] text-white border-[#F97316]" : "bg-white text-[#F97316] border-[#F97316]"); break;
                          case 'emerald': 
                              baseClass += (isActive ? "bg-[#10B981] text-white border-[#10B981]" : "bg-white text-[#10B981] border-[#10B981]"); break;
                          case 'purple':
                          default:
                              baseClass += (isActive ? "bg-[#8B5CF6] text-white border-[#8B5CF6]" : "bg-white text-[#8B5CF6] border-[#8B5CF6]"); break;
                      }
                      return (
                        <button 
                          key={tag.id}
                          onClick={() => toggleStudentTag(tag.id)}
                          className={baseClass}
                        >
                          {tag.name}
                        </button>
                      )
                    })}
                  </div>
                </div>

                {/* Clear Status */}
                <button 
                  onClick={markAsOnTime}
                  className="w-full py-3 mb-6 rounded-lg border-2 border-gray-800 bg-white text-gray-800 font-bold flex items-center justify-center gap-2 shadow-sm hover:bg-gray-50 transition-colors"
                >
                  <div className="w-4 h-4 rounded-full bg-green-500 shadow-inner"></div> 清除所有狀態 (設為準時)
                </button>

                {/* Manual Time */}
                <div className="mb-6">
                  <h3 className="text-sm font-bold text-[#8E7CC3] mb-2">手動修改時間</h3>
                  <div className="grid grid-cols-3 gap-2">
                    {['07:25', '07:30', '07:40', '07:45', '07:50', '08:00'].map(t => (
                      <button 
                        key={t}
                        onClick={() => {
                          const updated = { ...selectedStudent, checkTime: t };
                          setSelectedStudent(updated);
                          updateStudentData(updated.id, updated);
                          showToast(`✅ 時間已修改為 ${t}`);
                        }}
                        className="py-2 border border-gray-200 rounded-lg text-gray-700 font-bold text-sm bg-white hover:bg-gray-50 shadow-sm transition-colors"
                      >
                        {t}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Message */}
                <div className="mb-4">
                  <div className="flex items-center gap-2 mb-2 text-green-600 font-bold text-sm">
                    <div className="bg-green-600 rounded-sm w-4 h-4 flex items-center justify-center text-white text-xs">✓</div>
                    狀態已記錄！罐頭訊息已準備好。
                  </div>
                  <div id="canned-message-box" className="bg-gray-50 border border-gray-200 rounded-xl p-4 text-sm text-gray-600 leading-relaxed min-h-[100px] whitespace-pre-wrap font-medium">
                    {(() => {
                        const activeTags = selectedStudent.activeTags || [];
                        const tagNames = activeTags.map(tid => customTags.find(t => t.id === tid)?.name).filter(Boolean);
                        const timeStr = selectedStudent.checkTime || "未知時間";
                        let msg = `【班級通知】\n親愛的家長您好：\n跟您報告，貴子弟 ${selectedStudent.id}號 ${selectedStudent.name} `;
                        
                        if (tagNames.includes('缺席')) {
                            msg += `於 ${selectedDate} 目前尚未抵達教室 (缺席)。\n\n為確保孩子安全，請家長確認孩子狀況，並與導師聯繫，感謝您的配合！`;
                        } else if (tagNames.includes('遲到')) {
                            msg += `於 ${selectedDate} 的 ${timeStr} 平安抵達教室囉！\n\n溫馨提醒，依校規超過 07:30 算遲到，再麻煩家長協助提醒孩子稍微提早出門，非常感謝您的配合與支持！`;
                        } else if (tagNames.includes('請假') || tagNames.includes('病假') || tagNames.includes('事假')) {
                            msg += `今日 (${selectedDate}) 依家長通知已完成請假登記。\n\n祝孩子平安順心！`;
                        } else {
                            msg += `於 ${selectedDate} 的 ${timeStr} 平安抵達教室囉！\n\n感謝您的配合與支持！`;
                        }
                        return msg;
                    })()}
                  </div>
                </div>

                {/* Send Actions */}
                <div className="mb-6">
                  <p className="text-sm text-gray-600 mb-2 font-bold">請選擇傳送方式：</p>
                  <div className="grid grid-cols-3 gap-2">
                      <button 
                        onClick={() => {
                          const msg = document.getElementById('canned-message-box').innerText;
                          handleCopyToClipboard(msg, 'LINE 官方帳號');
                        }}
                        className="bg-[#333333] hover:bg-[#222] text-white rounded-xl py-2 flex flex-col items-center justify-center text-xs font-bold shadow-sm transition-colors leading-tight"
                      >
                        <MonitorPlay size={20} className="mb-1" /> LINE<br/>官方帳號
                      </button>
                      <button 
                        onClick={() => {
                          const msg = document.getElementById('canned-message-box').innerText;
                          handleCopyToClipboard(msg, 'LINE');
                        }}
                        className="bg-[#00B900] hover:bg-[#009900] text-white rounded-xl py-2 flex flex-col items-center justify-center text-xs font-bold shadow-sm transition-colors leading-tight"
                      >
                        <Smartphone size={20} className="mb-1" /> LINE<br/>個人轉發
                      </button>
                      <button 
                        onClick={() => {
                          const msg = document.getElementById('canned-message-box').innerText;
                          handleCopyToClipboard(msg, '簡訊');
                        }}
                        className="bg-[#0084FF] hover:bg-[#0066CC] text-white rounded-xl py-2 flex flex-col items-center justify-center text-xs font-bold shadow-sm transition-colors leading-tight"
                      >
                        <MessageSquare size={20} className="mb-1" /> 發送<br/>手機簡訊
                      </button>
                  </div>
                </div>

                {/* Close */}
                <button 
                  onClick={() => setSelectedStudent(null)}
                  className="w-full py-3 rounded-lg border-2 border-[#8E7CC3] text-[#8E7CC3] font-bold hover:bg-[#F2E5FF] transition-colors"
                >
                  關閉視窗
                </button>

              </div>
            </div>
          )}

          {/* Homework Edit Login Modal */}
          {showHwLoginModal && (
            <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm transition-opacity" onClick={() => setShowHwLoginModal(false)}>
              <div className="bg-white dark:bg-[#1e1e1e] rounded-[36px] p-6 sm:p-8 w-full max-w-sm shadow-2xl border-4 border-[#FFD94D] relative transform transition-all scale-100" onClick={e => e.stopPropagation()}>
                <h3 className="text-xl font-black text-gray-800 dark:text-gray-100 mb-2 flex items-center gap-2">
                  <Edit2 className="text-[#D4A017]" /> 解鎖編輯模式
                </h3>
                <p className="text-sm text-gray-500 font-bold mb-6">請輸入密碼以新增或修改聯絡簿內容</p>
                
                <form onSubmit={(e) => {
                    e.preventDefault();
                    if(hwPasswordInput === hwPassword) {
                        setIsHomeworkAuthenticated(true);
                        setHwPasswordInput('');
                        setShowHwLoginModal(false);
                        showToast("✅ 已開啟編輯模式");
                    } else {
                        showToast("❌ 密碼錯誤");
                    }
                }}>
                  <input
                    type="password"
                    value={hwPasswordInput}
                    onChange={(e) => setHwPasswordInput(e.target.value)}
                    placeholder="預設密碼：1234"
                    className="w-full bg-[#F8F9FA] dark:bg-[#2c2c2c] border-2 border-[#E9ECEF] dark:border-[#444] rounded-[20px] p-4 text-center text-xl text-gray-700 dark:text-gray-200 font-bold focus:border-[#FFD94D] focus:outline-none transition-colors mb-6"
                    autoFocus
                  />

                  <div className="flex gap-3">
                    <button 
                      type="button"
                      onClick={() => setShowHwLoginModal(false)}
                      className="flex-1 py-3 rounded-[20px] bg-gray-100 dark:bg-gray-800 text-gray-500 font-bold hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors"
                    >
                      取消
                    </button>
                    <button 
                      type="submit"
                      className="flex-1 py-3 rounded-[20px] bg-[#FFD94D] text-[#4A4022] shadow-[0_4px_0_0_#D4A017] hover:-translate-y-1 active:translate-y-1 active:shadow-none transition-all font-black"
                    >
                      確認解鎖
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Leave Reason Modal */}
          {showLeaveModal && selectedStudent && (
            <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm transition-opacity" onClick={() => { setShowLeaveModal(false); setPendingLeaveTag(null); }}>
              <div className="bg-white dark:bg-[#1e1e1e] rounded-[36px] p-6 sm:p-8 w-full max-w-sm shadow-2xl border-4 border-[#6EE39A] relative transform transition-all scale-100" onClick={e => e.stopPropagation()}>
                <h3 className="text-xl font-black text-gray-800 dark:text-gray-100 mb-4 flex items-center gap-2">
                  <MessageSquare className="text-[#2ECC71]" /> 請輸入病假原因
                </h3>
                <p className="text-sm text-gray-500 font-bold mb-4">學生：{selectedStudent.name}</p>
                
                <textarea
                  value={leaveReasonInput}
                  onChange={(e) => setLeaveReasonInput(e.target.value)}
                  placeholder="例如：發燒、感冒、肚子痛..."
                  className="w-full bg-[#F8F9FA] dark:bg-[#2c2c2c] border-2 border-[#E9ECEF] dark:border-[#444] rounded-[20px] p-4 text-gray-700 dark:text-gray-200 font-bold focus:border-[#6EE39A] focus:outline-none transition-colors min-h-[100px] mb-6 resize-none"
                ></textarea>

                <div className="flex gap-3">
                  <button 
                    onClick={() => { setShowLeaveModal(false); setPendingLeaveTag(null); }}
                    className="flex-1 py-3 rounded-[20px] bg-gray-100 dark:bg-gray-800 text-gray-500 font-bold hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors"
                  >
                    取消
                  </button>
                  <button 
                    onClick={submitLeaveReason}
                    className="flex-1 py-3 rounded-[20px] bg-[#E5FFE9] dark:bg-[#2B4A31] border-2 border-[#A1FFBB] text-[#2ECC71] shadow-[0_4px_0_0_#A1FFBB] hover:-translate-y-1 active:translate-y-1 active:shadow-none transition-all font-black"
                  >
                    確認送出
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
