y="system-ui, -apple-system, sans-serif" font-weight="800" font-size="160" fill="rgba(255,255,255,0.9)" transform="rotate(-10, 760, 860)" filter="url(#soft-shadow)">÷</text><text x="700" y="160" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="120" fill="rgba(255,255,255,0.5)" transform="rotate(15, 700, 160)" filter="url(#soft-shadow)">B</text><text x="100" y="680" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="110" fill="rgba(255,255,255,0.4)" transform="rotate(-25, 100, 680)" filter="url(#soft-shadow)">C</text><text x="850" y="620" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="120" fill="rgba(255,255,255,0.8)" transform="rotate(-5, 850, 620)" filter="url(#soft-shadow)">100</text></svg>`;

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            // Firebase 狀態
            const [firebaseReady, setFirebaseReady] = useState(!!window.firebaseAPI?.auth);
            const [firebaseUser, setFirebaseUser] = useState(null);
            
            // 確保 appId 絕對不為空字串，避免 Firebase 路徑解析錯誤
            // 這裡加入自動判斷：Gemini 環境用內建 ID，GitHub 用自訂的固定 ID
            const appId = (typeof __app_id !== 'undefined' && __app_id) ? __app_id : 'class-315-system'; 
            const basePath = `artifacts/${appId}/public/data`;
            
            // 系統模式與頁面
            const [viewMode, setViewMode] = useState('parent-login'); 
            const [currentStudent, setCurrentStudent] = useState(null);
            const [students, setStudents] = useState([]);
            
            // 系統設定
            const [settings, setSettings] = useState({
                className: "315",
                gradingTone: "溫和鼓勵", 
                printRemark: "請家長與學生一同審視本次段考各科目範圍的熟練度，並持續配合在家複習。",
                examType: "一般", 
                showTotalAvg: true,
                showGradeLevel: true,
                showClassAvg: true,
                showProgress: true,
                enableComments: true,
                showRadarChart: true,
                subjects: []
            });

            const [loginData, setLoginData] = useState({ seatNo: '', password: '' });
            const [teacherPass, setTeacherPass] = useState('');
            const [showTeacherModal, setShowTeacherModal] = useState(false);
            
            const [editingSubject, setEditingSubject] = useState(null);
            const [editForm, setEditForm] = useState({ score: '' });
            
            const [modifyingStudent, setModifyingStudent] = useState(null);
            const [showAddStudent, setShowAddStudent] = useState(false);
            const [newStudentData, setNewStudentData] = useState({ seatNo: '', name: '', password: '' });

            const [newSubjectName, setNewSubjectName] = useState('英文');
            const [customSubjectName, setCustomSubjectName] = useState('');
            const [newSubjectScope, setNewSubjectScope] = useState('');
            const [newSubjectDate, setNewSubjectDate] = useState('');

            // UI 狀態控制
            const [editingSubjectConfig, setEditingSubjectConfig] = useState(null);
            const [toast, setToast] = useState(null);
            const [excelDragActive, setExcelDragActive] = useState(false);
            
            const fileInputRef = useRef(null);
            const subjectFileInputRef = useRef(null);
            const backupFileInputRef = useRef(null);

            // ================= Firebase 初始化與驗證 =================
            useEffect(() => {
                if (!window.firebaseAPI?.auth) {
                    const handleReady = () => setFirebaseReady(true);
                    window.addEventListener('firebase-ready', handleReady);
                    return () => window.removeEventListener('firebase-ready', handleReady);
                }
            }, []);

            useEffect(() => {
                if (!firebaseReady) return;
                const { auth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } = window.firebaseAPI;
                
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (err) {
                        console.warn("自訂驗證憑證可能已過期，啟動備用連線...", err);
                        // 防呆機制：Token 過期時自動降級為一般訪客連線
                        try {
                            await signInAnonymously(auth);
                        } catch (fallbackErr) {
                            console.error("備用連線也失敗:", fallbackErr);
                            showToast("系統連線異常，請嘗試重新整理網頁。", "error");
                        }
                    }
                };

                initAuth();
                const unsubscribe = onAuthStateChanged(auth, user => {
                    setFirebaseUser(user);
                });
                return () => unsubscribe();
            }, [firebaseReady]);

            // ================= 監聽資料庫 =================
            useEffect(() => {
                if (!firebaseReady || !firebaseUser) return;
                const { db, onSnapshot, doc, collection } = window.firebaseAPI;

                // 改用絕對路徑寫法，避免 Firebase 解析陣列時出錯
                const settingsRef = doc(db, `${basePath}/settings/global`);
                const unsubSettings = onSnapshot(settingsRef, (snap) => {
                    if (snap.exists()) {
                        const cloudData = snap.data();
                        let rawSubjects = cloudData.subjects || [];
                        const normalizedSubjects = rawSubjects.map(sub => {
                            if (typeof sub === 'string') return { name: sub, date: "07/05", scope: "未設定範圍", locked: false };
                            return { name: sub.name || "", date: sub.date || "未設定", scope: sub.scope || "未設定", locked: sub.locked || false };
                        });
                        setSettings({ ...cloudData, subjects: normalizedSubjects, examType: cloudData.examType || "一般", showRadarChart: cloudData.showRadarChart ?? true });
                    }
                }, (error) => console.error("設定檔讀取失敗:", error));

                // 改用絕對路徑寫法
                const studentsRef = collection(db, `${basePath}/submissions`);
                const unsubStudents = onSnapshot(studentsRef, (snap) => {
                    const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    list.sort((a, b) => String(a.seatNo || '').localeCompare(String(b.seatNo || ''), undefined, {numeric: true}));
                    setStudents(list);

                    if (currentStudent) {
                        const updated = list.find(s => s.id === currentStudent.id);
                        if (updated) setCurrentStudent(updated);
                    }
                }, (error) => console.error("學生資料讀取失敗:", error));

                return () => { unsubSettings(); unsubStudents(); };
            }, [firebaseReady, firebaseUser, basePath, currentStudent?.id]);

            // ================= 工具函數 =================
            const showToast = (text, type = 'success') => {
                setToast({ text, type });
                setTimeout(() => setToast(null), 3000);
            };

            const saveSettingsToCloud = async (newSettings) => {
                if (!firebaseUser) return showToast("資料庫連線中，請稍候片刻...", "warning");
                try {
                    const { db, doc, setDoc } = window.firebaseAPI;
                    await setDoc(doc(db, `${basePath}/settings/global`), newSettings);
                    showToast("教師端設定已同步儲存！");
                } catch (e) {
                    showToast("同步失敗：" + e.message, "error");
                }
            };

            const getStudentScore = (student, subName) => {
                if (!student?.scores) return null;
                const s = student.scores[subName];
                if (s === undefined || s === null || s === '') return null;
                if (typeof s === 'number') return s;
                if (typeof s === 'string') return parseFloat(s) || null;
                return null;
            };

            const calculateStudentAvg = (student) => {
                if (!student?.scores || settings.subjects.length === 0) return 0;
                let sum = 0, validCount = 0;
                settings.subjects.forEach(sub => {
                    const val = getStudentScore(student, sub.name);
                    if (val !== null) { sum += val; validCount++; }
                });
                return validCount > 0 ? sum / validCount : 0;
            };

            const calculateClassSubjectAvg = (subjectName) => {
                if (students.length === 0) return 0;
                let sum = 0, count = 0;
                students.forEach(s => {
                    const val = getStudentScore(s, subjectName);
                    if (val !== null) { sum += val; count++; }
                });
                return count > 0 ? sum / count : 0;
            };

            const getGradeLevelStats = () => {
                const stats = { A: 0, B: 0, C: 0, D: 0, E: 0, avg: 0 };
                if (students.length === 0) return stats;
                let totalSum = 0;
                students.forEach(s => {
                    const avg = calculateStudentAvg(s);
                    totalSum += avg;
                    if (avg >= 90) stats.A++;
                    else if (avg >= 80) stats.B++;
                    else if (avg >= 70) stats.C++;
                    else if (avg >= 60) stats.D++;
                    else stats.E++;
                });
                stats.avg = totalSum / students.length;
                return stats;
            };

            const getGradeLevelName = (avg) => {
                if (avg >= 90) return "A級距 (90-100)";
                if (avg >= 80) return "B級距 (80-89)";
                if (avg >= 70) return "C級距 (70-79)";
                if (avg >= 60) return "D級距 (60-69)";
                return "E級距 (60分以下)";
            };

            const getLocalDiagnostic = (student, subName, score, classAvg, tone) => {
                if (score === null || score === undefined) return "尚未登記該科成績。";
                if (tone === "溫和鼓勵") {
                    if (score >= 90) return `${subName}表現優異，觀念通透，請繼續保持優秀手感！`;
                    if (score >= 80) return `${subName}實力良好，多一份細心與沉著就能再次突破。`;
                    if (score >= 60) return `${subName}基本分已掌握，針對錯題進行反思即可穩步前進。`;
                    return `${subName}目前稍嫌吃力，建議每日花15分鐘重新釐清觀念。`;
                } else if (tone === "積極督促") {
                    if (score >= 90) return `${subName}成績頂尖但不能自滿，應挑戰更高階的思考題。`;
                    if (score >= 80) return `${subName}觀念理解但粗心偏多，考後請確實落實錯題訂正。`;
                    if (score >= 60) return `${subName}成績中游，讀書複習必須更加主動以防退步。`;
                    return `${subName}落後較多，務必制定每天練習計畫，重新打穩基礎。`;
                } else {
                    if (score >= 90) return `${subName}維持高分，請精益求精，嚴防任何粗心失誤。`;
                    if (score >= 80) return `${subName}有中上水準，但仍需提高考卷作答的專注度。`;
                    if (score >= 60) return `${subName}在及格邊緣，核心觀念仍顯模糊，請及時補強。`;
                    return `${subName}成績已亮紅燈！觀念落後嚴重，請立即進行輔導。`;
                }
            };

            // ================= 共用匯入寫入邏輯 =================
            const processExcelOrCsv = (file, callback) => {
                if (!file) return;
                if (!firebaseUser) return showToast("資料庫連線中，請稍候片刻...", "warning");

                const reader = new FileReader();
                reader.onload = async (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        // SheetJS 強大的相容性，可同時完美處理帶有 BOM 的 CSV 與各類 Excel 檔案
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheetName = workbook.SheetNames[0];
                        const json = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheetName], { defval: "" });
                        
                        // 移除標題列中夾帶的 BOM (\uFEFF) 與空白字元，確保鍵值比對 100% 成功
                        const cleanedJson = json.map(row => {
                            const cRow = {};
                            for (let k in row) cRow[k.replace(/^\uFEFF/, '').trim()] = row[k];
                            return cRow;
                        });
                        
                        await callback(cleanedJson);
                    } catch (err) {
                        showToast("檔案解析失敗，請確認檔案格式：" + err.message, "error");
                    }
                };
                reader.readAsArrayBuffer(file);
            };

            const processImportedJson = async (json) => {
                if (json.length === 0) return showToast("檔案內沒有有效數據！", "error");

                const parsedStudents = json.map((row, idx) => {
                    const seat = String(row['座號'] || String(idx+1)).trim();
                    const existingStudent = students.find(s => s.seatNo === seat);
                    
                    const studentScores = { ...(existingStudent?.scores || {}) };
                    settings.subjects.forEach(sub => {
                        if (row[sub.name] !== undefined && row[sub.name] !== '') {
                            studentScores[sub.name] = parseFloat(row[sub.name]);
                        }
                    });

                    return {
                        id: `student_${seat}`,
                        seatNo: seat,
                        name: String(row['姓名'] || (existingStudent ? existingStudent.name : `同學 ${idx+1}`)).trim(),
                        password: row['密碼'] !== undefined && row['密碼'] !== '' ? String(row['密碼']).trim() : (existingStudent ? existingStudent.password : seat), 
                        progress: row['進步分數'] !== undefined && row['進步分數'] !== '' ? parseFloat(row['進步分數']) : (existingStudent?.progress || 0),
                        loginCount: existingStudent?.loginCount || 0,
                        classRank: row['班排'] !== undefined && row['班排'] !== '' ? parseInt(row['班排']) : (existingStudent?.classRank || null),
                        classRankProgress: row['班排進步'] !== undefined && row['班排進步'] !== '' ? parseInt(row['班排進步']) : (existingStudent?.classRankProgress || null),
                        schoolRank: row['校排'] !== undefined && row['校排'] !== '' ? parseInt(row['校排']) : (existingStudent?.schoolRank || null),
                        schoolRankProgress: row['校排進步'] !== undefined && row['校排進步'] !== '' ? parseInt(row['校排進步']) : (existingStudent?.schoolRankProgress || null),
                        scores: studentScores
                    };
                });

                try {
                    const { db, doc, setDoc } = window.firebaseAPI;
                    // 使用 Promise.all 進行平行寫入，改用絕對路徑
                    await Promise.all(parsedStudents.map(s => setDoc(doc(db, `${basePath}/submissions/${s.id}`), s)));
                    showToast(`✅ 成功匯入更新 ${parsedStudents.length} 筆學生資料與成績！`);
                } catch (err) {
                    showToast("寫入資料庫失敗：" + err.message, "error");
                }
            };

            // ================= 批次匯入功能 (增強 CSV 與 Excel 雙支援) =================
            const handleFileUpload = (file) => {
                processExcelOrCsv(file, processImportedJson);
                if (fileInputRef.current) fileInputRef.current.value = "";
            };

            const handleSubjectExcelUpload = (file) => {
                processExcelOrCsv(file, async (json) => {
                    if (json.length === 0) return showToast("無數據", "error");
                    const newSubjects = json.map(row => ({
                        name: String(row['科目'] || row['考科'] || '').trim(),
                        scope: String(row['範圍'] || row['考試範圍'] || '未設定').trim(),
                        date: String(row['日期'] || row['考試日期'] || '未設定').trim(),
                        locked: false
                    })).filter(s => s.name !== '');

                    if(newSubjects.length === 0) return showToast("找不到「科目」標題列，請確認範本格式", "error");

                    const updatedSettings = { ...settings, subjects: newSubjects };
                    setSettings(updatedSettings);
                    await saveSettingsToCloud(updatedSettings);
                    showToast(`✅ 成功批次匯入 ${newSubjects.length} 個考試科目！`);
                });
                
                if (subjectFileInputRef.current) subjectFileInputRef.current.value = "";
            };

            // ================= 檔案匯出與下載 =================
            const exportGradesToCSV = () => {
                if (students.length === 0) return showToast("沒有資料可以匯出！", "error");
                let csvContent = "\uFEFF座號,姓名,密碼,登入次數,進步分數,班排,班排進步,校排,校排進步";
                settings.subjects.forEach(sub => csvContent += `,${sub.name}`);
                csvContent += ",總平均\r\n";

                students.forEach(s => {

                                                    <input type="checkbox" checked={settings[prop] !== false} onChange={e => { const s = {...settings, [prop]: e.target.checked}; setSettings(s); saveSettingsToCloud(s); }} className="rounded text-[#00704A] w-3.5 h-3.5 focus:ring-0" />
                                                    <span className="truncate">{label}</span>
                                                </label>
                                            )
                                        })}
                                    </div>
                                </div>
                            </div>

                            {/* 右側學生名冊區 */}
                            <div className="flex-grow flex flex-col gap-5">
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
                                    <div onDragOver={e=>{e.preventDefault();setExcelDragActive(true);}} onDragLeave={()=>setExcelDragActive(false)} onDrop={e=>{e.preventDefault();setExcelDragActive(false);handleFileUpload(e.dataTransfer.files[0]);}} className={`p-8 border-2 border-dashed rounded-[2rem] text-center flex flex-col items-center justify-center transition ${excelDragActive ? 'border-[#00704A] bg-emerald-50' : 'bg-white'}`}>
                                        <span className="text-4xl mb-2">🧑‍🎓</span>
                                        <h4 className="font-bold text-sm">拖放 Excel / CSV 批次匯入【名單與成績】</h4>
                                        <p className="text-[10px] text-slate-500 mt-1">支援班排、校排等進階欄位，可當週報更新</p>
                                        <div className="flex flex-wrap gap-2 mt-4 justify-center">
                                            <button onClick={() => fileInputRef.current.click()} className="bg-[#00704A] hover:bg-[#005a3c] text-white text-xs px-4 py-2 rounded-xl font-bold transition shadow-md">📤 匯入名單與成績</button>
                                            <button onClick={loadDemoData} className="bg-[#CBA258] hover:bg-[#b08b45] text-white font-bold text-xs px-3.5 py-2 rounded-xl transition shadow-md">一鍵載入正式名單</button>
                                            <button onClick={downloadStudentTemplate} className="bg-emerald-100 hover:bg-emerald-200 text-[#00704A] font-bold text-xs px-3.5 py-2 rounded-xl transition">📥 下載範本</button>
                                            <button onClick={clearDatabase} className="bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-xs px-3.5 py-2 rounded-xl border transition">清空資料</button>
                                            <button onClick={exportGradesToCSV} className="bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs px-3.5 py-2 rounded-xl transition shadow-sm">💾 匯出 Excel</button>
                                        </div>
                                        <input type="file" ref={fileInputRef} className="hidden" accept=".xlsx, .csv" onChange={e => handleFileUpload(e.target.files[0])} />
                                    </div>

                                    <div className="bg-white p-6 rounded-[2rem] border shadow-xl grid grid-cols-2 sm:grid-cols-3 gap-4">
                                        <div className="bg-slate-50 p-4 rounded-2xl border">
                                            <span className="block text-[10px] font-bold">總學生數</span>
                                            <span className="block text-2xl font-black text-[#00704A] mt-1">{students.length}</span>
                                        </div>
                                        <div className="bg-slate-50 p-4 rounded-2xl border">
                                            <span className="block text-[10px] font-bold">總計登入次數</span>
                                            <span className="block text-2xl font-black text-amber-500 mt-1">
                                                {students.reduce((acc, curr) => acc + (curr.loginCount || 0), 0)}
                                            </span>
                                        </div>
                                        <div className="bg-slate-50 p-4 rounded-2xl border">
                                            <span className="block text-[10px] font-bold">班級總平均</span>
                                            <span className="block text-2xl font-black text-indigo-700 mt-1">{stats.avg.toFixed(1)}</span>
                                        </div>
                                        <div className="bg-slate-50 p-4 rounded-2xl border col-span-2 sm:col-span-3 flex justify-between items-center">
                                            <div className="text-xs text-slate-500 font-bold">A級:{stats.A} | B級:{stats.B} | C級:{stats.C} | 總不及格:{stats.E}</div>
                                        </div>
                                    </div>
                                </div>

                                {/* 系統安全備份區塊 */}
                                <div className="bg-slate-800 p-5 rounded-3xl border border-slate-700 shadow-lg flex flex-col sm:flex-row justify-between items-center gap-4 text-slate-300">
                                    <div>
                                        <h4 className="font-bold text-white flex items-center gap-2"><span>🛡️</span> 系統安全與資料備份</h4>
                                        <p className="text-xs mt-1">匯出 JSON 格式以完整備份「所有設定與學生成績」。若有遺失可隨時還原。</p>
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={() => backupFileInputRef.current.click()} className="bg-slate-700 hover:bg-slate-600 text-white text-xs px-4 py-2.5 rounded-xl font-bold transition">
                                            🔄 從備份還原
                                        </button>
                                        <button onClick={exportBackupJSON} className="bg-amber-500 hover:bg-amber-600 text-amber-950 text-xs px-4 py-2.5 rounded-xl font-bold transition shadow-md">
                                            💾 下載完整備份
                                        </button>
                                        <input type="file" ref={backupFileInputRef} className="hidden" accept=".json" onChange={e => importBackupJSON(e.target.files[0])} />
                                    </div>
                                </div>

                                <div className="bg-white rounded-[2rem] border shadow-xl overflow-hidden">
                                    <div className="p-5 border-b flex justify-between items-center bg-slate-50">
                                        <h4 className="font-black flex items-center gap-2"><span>📋</span>班級名冊與成績總覽</h4>
                                        <div className="flex gap-2">
                                            <button onClick={() => setViewMode('batch-print')} className="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-3 py-1.5 rounded-xl shadow-md transition-all active:scale-95">🖨️ 列印全班成績單</button>
                                            <button onClick={() => setShowAddStudent(!showAddStudent)} className="bg-[#00704A] text-white text-xs font-bold px-3 py-1.5 rounded-xl">{showAddStudent ? "❌ 取消" : "➕ 新增個別學生"}</button>
                                        </div>
                                    </div>

                                    {showAddStudent && (
                                        <div className="p-5 bg-emerald-50/50 flex flex-wrap gap-4 items-end animate-fade-in border-b border-emerald-100">
                                            <div className="w-full sm:w-1/4">
                                                <input type="text" placeholder="座號 (例:1)" className="w-full p-2 bg-white border rounded-lg text-xs" value={newStudentData.seatNo} onChange={e => setNewStudentData({...newStudentData, seatNo: e.target.value})} />
                                            </div>
                                            <div className="w-full sm:w-1/4">
                                                <input type="text" placeholder="姓名" className="w-full p-2 bg-white border rounded-lg text-xs" value={newStudentData.name} onChange={e => setNewStudentData({...newStudentData, name: e.target.value})} />
                                            </div>
                                            <div className="w-full sm:w-1/4">
                                                <input type="text" placeholder="登入密碼 (未填則預設為座號)" className="w-full p-2 bg-white border rounded-lg text-xs" value={newStudentData.password} onChange={e => setNewStudentData({...newStudentData, password: e.target.value})} />
                                            </div>
                                            <button onClick={handleAddStudent} className="bg-[#00704A] text-white text-xs px-4 py-2 rounded-lg font-bold">確定新增</button>
                                        </div>
                                    )}

                                    <div className="overflow-x-auto">
                                        <table className="min-w-full text-center text-xs">
                                            <thead className="bg-slate-100">
                                                <tr>
                                                    <th className="px-4 py-3 font-bold pl-6">座號</th>
                                                    <th className="px-4 py-3 font-bold">姓名</th>
                                                    <th className="px-2 py-3 font-bold text-amber-600">密碼</th>
                                                    <th className="px-2 py-3 font-bold text-slate-500" title="家長登入次數">👁️ 登入</th>
                                                    {settings.subjects.map(sub => <th key={sub.name} className="px-2 py-3 font-bold">{sub.name}</th>)}
                                                    <th className="px-3 py-3 font-bold text-indigo-700">平均</th>
                                                    <th className="px-3 py-3 font-bold">總分進步</th>
                                                    {(settings.examType === '段考' || settings.examType === '模擬考') && <th className="px-2 py-3 font-bold text-indigo-600">班排</th>}
                                                    {(settings.examType === '段考' || settings.examType === '模擬考') && <th className="px-2 py-3 font-bold text-purple-600">校排</th>}
                                                    <th className="px-4 py-3 font-bold text-right pr-6">操作</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 font-medium">
                                                {students.map((s, idx) => (
                                                    <tr key={idx} className="hover:bg-slate-50">
                                                        <td className="px-4 py-3.5 pl-6 font-bold text-[#00704A]">{s.seatNo}</td>
                                                        <td className="px-4 py-3.5 font-bold">{s.name}</td>
                                                        <td className="px-2 py-3.5 font-mono text-[10px] text-amber-600 bg-amber-50/50 rounded">{s.password || s.seatNo}</td>
                                                        <td className="px-2 py-3.5 font-bold text-slate-500">
                                                            {s.loginCount > 0 ? <span className="bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded-full">{s.loginCount}</span> : "0"}
                                                        </td>
                                                        {settings.subjects.map(sub => {
                                                            const sc = getStudentScore(s, sub.name);
                                                            const avg = calculateClassSubjectAvg(sub.name);
                                                            const isB = sc !== null && avg > 0 && sc < avg;
                                                            return <td key={sub.name} className={`px-2 py-3.5 ${isB ? 'text-rose-600 font-bold bg-rose-50/20' : 'text-slate-500'}`}>{sc !== null ? sc.toFixed(1) : "-"}</td>
                                                        })}
                                                        <td className="px-3 py-3.5 font-extrabold text-indigo-700">{calculateStudentAvg(s).toFixed(1)}</td>
                                                        <td className={`px-3 py-3.5 font-bold whitespace-nowrap ${s.progress > 0 ? 'text-emerald-600' : s.progress < 0 ? 'text-rose-500' : 'text-slate-500'}`}>
                                                            {s.progress > 0 ? `⬆️ +${s.progress}` : s.progress < 0 ? `⬇️ ${Math.abs(s.progress)}` : "0"}
                                                        </td>
                                                        {(settings.examType === '段考' || settings.examType === '模擬考') && (
                                                            <td className="px-2 py-3.5 text-center">
                                                                <div className="font-bold text-indigo-700">{s.classRank || '-'}</div>
                                                                {s.classRankProgress ? <div className={`text-[10px] font-bold ${s.classRankProgress > 0 ? 'text-emerald-600' : 'text-rose-500'}`}>{s.classRankProgress > 0 ? `⬆️+${s.classRankProgress}` : `⬇️${Math.abs(s.classRankProgress)}`}</div> : null}
                                                            </td>
                                                        )}
                                                        {(settings.examType === '段考' || settings.examType === '模擬考') && (
                                                            <td className="px-2 py-3.5 text-center">
                                                                <div className="font-bold text-purple-700">{s.schoolRank || '-'}</div>
                                                                {s.schoolRankProgress ? <div className={`text-[10px] font-bold ${s.schoolRankProgress > 0 ? 'text-emerald-600' : 'text-rose-500'}`}>{s.schoolRankProgress > 0 ? `⬆️+${s.schoolRankProgress}` : `⬇️${Math.abs(s.schoolRankProgress)}`}</div> : null}
                                                            </td>
                                                        )}
                                                        <td className="px-4 py-3.5 text-right pr-6 whitespace-nowrap">
                                                            <button onClick={() => setModifyingStudent(s)} className="text-blue-600 mr-2" title="編輯學生密碼與成績">📝</button>
                                                            <button onClick={() => handleDeleteStudent(s)} className="text-rose-600 mr-2" title="刪除學生">🗑️</button>
                                                            <button onClick={() => { setCurrentStudent(s); setViewMode('parent-dashboard'); }} className="text-[#00704A]" title="預覽該生成績單">🔎</button>
                                                        </td>
                                                    </tr>
                                                ))}
                                                {students.length === 0 && <tr><td colSpan="20" className="py-8 text-slate-400">目前沒有學生資料</td></tr>}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>

                            {/* 學生單一編輯 Modal */}
                            {modifyingStudent && (
                                <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 p-4">
                                    <div className="bg-white rounded-3xl w-full max-w-2xl p-6 flex flex-col gap-4 max-h-[90vh]">
                                        <div className="flex justify-between items-center border-b pb-3">
                                            <h3 className="font-bold">📝 編輯：{modifyingStudent.name}</h3>
                                            <button onClick={() => setModifyingStudent(null)} className="text-slate-400">關閉</button>
                                        </div>
                                        <div className="overflow-y-auto pr-1 space-y-4">
                                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 bg-slate-50 p-4 rounded-2xl">
                                                <div><label className="text-[10px] text-slate-500">姓名</label><input type="text" className="w-full p-2 border rounded-xl text-sm" value={modifyingStudent.name} onChange={e=>setModifyingStudent({...modifyingStudent, name:e.target.value})}/></div>
                                                <div><label className="text-[10px] text-slate-500">自訂登入密碼</label><input type="text" className="w-full p-2 border rounded-xl text-sm" value={modifyingStudent.password} onChange={e=>setModifyingStudent({...modifyingStudent, password:e.target.value})}/></div>
                                                <div><label className="text-[10px] text-slate-500">總分進步分數</label><input type="number" className="w-full p-2 border rounded-xl text-sm" value={modifyingStudent.progress} onChange={e=>setModifyingStudent({...modifyingStudent, progress:parseFloat(e.target.value)||0})}/></div>
                                                <div><label className="text-[10px] text-slate-500">手動歸零登入次數</label><button onClick={() => setModifyingStudent({...modifyingStudent, loginCount: 0})} className="w-full p-2 bg-slate-200 hover:bg-slate-300 rounded-xl text-xs font-bold text-slate-600 mt-1">目前: {modifyingStudent.loginCount || 0} (點擊歸零)</button></div>
                                            </div>
                                            
                                            {(settings.examType === '段考' || settings.examType === '模擬考') && (
                                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 bg-indigo-50/30 p-4 rounded-2xl border border-indigo-100">
                                                    <div><label className="text-[10px] text-indigo-500 font-bold">班級排名</label><input type="number" placeholder="未填" className="w-full p-2 border border-indigo-200 rounded-xl text-sm text-indigo-700 font-bold" value={modifyingStudent.classRank || ''} onChange={e=>setModifyingStudent({...modifyingStudent, classRank:parseInt(e.target.value)||null})}/></div>
                                                    <div><label className="text-[10px] text-indigo-500 font-bold">班排進步 (正數為進步)</label><input type="number" placeholder="未填" className="w-full p-2 border border-indigo-200 rounded-xl text-sm" value={modifyingStudent.classRankProgress || ''} onChange={e=>setModifyingStudent({...modifyingStudent, classRankProgress:parseInt(e.target.value)||null})}/></div>
                                                    <div><label className="text-[10px] text-purple-500 font-bold">全校排名</label><input type="number" placeholder="未填" className="w-full p-2 border border-purple-200 rounded-xl text-sm text-purple-700 font-bold" value={modifyingStudent.schoolRank || ''} onChange={e=>setModifyingStudent({...modifyingStudent, schoolRank:parseInt(e.target.value)||null})}/></div>
                                                    <div><label className="text-[10px] text-purple-500 font-bold">校排進步 (正數為進步)</label><input type="number" placeholder="未填" className="w-full p-2 border border-purple-200 rounded-xl text-sm" value={modifyingStudent.schoolRankProgress || ''} onChange={e=>setModifyingStudent({...modifyingStudent, schoolRankProgress:parseInt(e.target.value)||null})}/></div>
                                                </div>
                                            )}

                                            <div className="grid grid-cols-2 gap-3">
                                                {settings.subjects.map(sub => (
                                                    <div key={sub.name} className="bg-stone-50 p-2 rounded-xl flex justify-between items-center">
                                                        <span className="text-xs font-bold text-[#00704A]">{sub.name}</span>
                                                        <input type="number" className="w-20 p-1 border rounded text-xs text-center" value={getStudentScore(modifyingStudent, sub.name) ?? ''} onChange={e=>{
                                                            const val = e.target.value === '' ? '' : parseFloat(e.target.value);
                                                            setModifyingStudent({...modifyingStudent, scores: {...(modifyingStudent.scores||{}), [sub.name]: val}});
                                                        }} />
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                        <div className="flex justify-end gap-2 pt-3 border-t">
                                            <button onClick={() => setModifyingStudent(null)} className="px-4 py-2 border rounded-xl text-xs">取消</button>
                                            <button onClick={saveModifiedStudent} className="bg-[#00704A] text-white px-5 py-2 rounded-xl text-xs font-bold">儲存</button>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </main>
                    )}

                    {/* 教師管理登入 Modal */}
                    {showTeacherModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 p-4" onClick={() => setShowTeacherModal(false)}>
                            <div className="bg-white w-full max-w-sm rounded-3xl p-6" onClick={e => e.stopPropagation()}>
                                <h3 className="text-lg font-bold text-center mb-4">🔑 教師身分驗證</h3>
                                <input type="password" placeholder="請輸入管理密碼 (預設: fxm315)" className="w-full bg-slate-50 border rounded-2xl px-4 py-3 text-sm mb-4" value={teacherPass} onChange={e => setTeacherPass(e.target.value)} onKeyDown={e => e.key==='Enter' && handleTeacherLoginOnMain()} />
                                <div className="flex gap-2">
                                    <button onClick={() => setShowTeacherModal(false)} className="flex-1 bg-slate-100 py-3 rounded-2xl text-sm">取消</button>
                                    <button onClick={handleTeacherLoginOnMain} className="flex-1 bg-[#00704A] text-white py-3 rounded-2xl text-sm font-bold">登入</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
